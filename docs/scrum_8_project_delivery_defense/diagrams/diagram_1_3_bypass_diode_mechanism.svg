<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.12" />
    </filter>
    <linearGradient id="cellNormal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cellShaded" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <marker id="arrBlue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#0284C7" />
    </marker>
    <marker id="arrRed" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="510" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

  <!-- Header -->
  <rect x="20" y="15" width="900" height="46" rx="8" fill="#0F172A" />
  <text x="470" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">
    CƠ CHẾ BẢO VỆ CỦA BYPASS DIODE &amp; SỰ SỤT GIẢM SẢN LƯỢNG KHI BỊ CHE BÓNG
  </text>

  <!-- Main Module Container -->
  <rect x="40" y="75" width="860" height="310" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Input String Current -->
  <g transform="translate(60, 95)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1">Dòng String DC (I = 10A)</text>
    <line x1="0" y1="15" x2="60" y2="15" stroke="#0284C7" stroke-width="3" marker-end="url(#arrBlue)" />
  </g>

  <!-- Substring 1 (Normal) -->
  <g transform="translate(130, 115)">
    <rect width="210" height="180" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="105" y="24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0369A1" text-anchor="middle">
      PHÂN VÙNG 1 (24 Cells)
    </text>
    <!-- Mini Cells -->
    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="45" y="0" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="90" y="0" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="135" y="0" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="0" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="45" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="90" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="135" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
    </g>
    <text x="105" y="148" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">
      V_sub1 = +14.0 V (Bình thường)
    </text>
    <text x="105" y="165" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">
      Phát quang điện đầy đủ
    </text>
  </g>

  <!-- Substring 2 (Shaded Cell) -->
  <g transform="translate(365, 115)">
    <rect width="210" height="180" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" />
    <text x="105" y="24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="middle">
      PHÂN VÙNG 2 (BỊ CHE BÓNG)
    </text>
    <!-- Mini Cells -->
    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="45" y="0" width="35" height="40" rx="3" fill="url(#cellShaded)" />
      <text x="62" y="24" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#F87171" text-anchor="middle">BÓNG</text>
      
      <rect x="90" y="0" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="135" y="0" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="0" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="45" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="90" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="135" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
    </g>
    <text x="105" y="148" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="middle">
      V_sub2 = -16.0 V (Nghẽn dòng)
    </text>
    <text x="105" y="165" font-family="system-ui, sans-serif" font-size="9.5" fill="#B91C1C" text-anchor="middle">
      Nguy cơ gây Hot-Spot cháy nổ
    </text>
  </g>

  <!-- Substring 3 (Normal) -->
  <g transform="translate(600, 115)">
    <rect width="210" height="180" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="105" y="24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0369A1" text-anchor="middle">
      PHÂN VÙNG 3 (24 Cells)
    </text>
    <!-- Mini Cells -->
    <g transform="translate(20, 35)">
      <rect x="0" y="0" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="45" y="0" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="90" y="0" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="135" y="0" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="0" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="45" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="90" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
      <rect x="135" y="50" width="35" height="40" rx="3" fill="url(#cellNormal)" />
    </g>
    <text x="105" y="148" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">
      V_sub3 = +14.0 V (Bình thường)
    </text>
    <text x="105" y="165" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">
      Phát quang điện đầy đủ
    </text>
  </g>

  <!-- Bypass Diodes Line (Bottom) -->
  <g transform="translate(0, 315)">
    <!-- Diode 1 (OFF) -->
    <rect x="180" y="0" width="110" height="34" rx="5" fill="#F1F5F9" stroke="#94A3B8" />
    <text x="235" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Diode D1: TẮT</text>
    <text x="235" y="28" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748B" text-anchor="middle">Phân cực ngược (Ngắt)</text>

    <!-- Diode 2 (ON - BYPASS ACTIVATED) -->
    <rect x="415" y="-6" width="110" height="44" rx="5" fill="#DC2626" filter="url(#shadow)" />
    <text x="470" y="14" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Diode D2: BẬT</text>
    <text x="470" y="28" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#FEF08A" text-anchor="middle">DẪN THÔNG 10A</text>

    <!-- Bypass Current Flow Arrow -->
    <path d="M 370 -10 L 410 15 L 530 15 L 575 -10" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrRed)" />

    <!-- Diode 3 (OFF) -->
    <rect x="650" y="0" width="110" height="34" rx="5" fill="#F1F5F9" stroke="#94A3B8" />
    <text x="705" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Diode D3: TẮT</text>
    <text x="705" y="28" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748B" text-anchor="middle">Phân cực ngược (Ngắt)</text>
  </g>

  <!-- Output Arrow -->
  <g transform="translate(820, 195)">
    <text x="0" y="-10" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0369A1">Đến Inverter</text>
    <line x1="0" y1="10" x2="55" y2="10" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrBlue)" />
    <text x="0" y="28" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#DC2626">V_out = 28V (-33%)</text>
  </g>

  <!-- Summary Footer -->
  <g transform="translate(40, 400)">
    <rect width="860" height="95" rx="8" fill="#FFFBEB" stroke="#FDE68A" />
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#92400E">
      ĐẶC TRƯNG DỮ LIỆU TELEMETRY KHI BYPASS DIODE KÍCH HOẠT:
    </text>
    <text x="20" y="44" font-family="system-ui, sans-serif" font-size="10.5" fill="#78350F">
      • Khi 1 diode bypass dẫn thông bảo vệ (hoặc bị đánh thủng ngắn mạch), điện áp tấm pin sẽ sụt giảm chính xác 33.3% (mất 1/3 điện áp).
    </text>
    <text x="20" y="62" font-family="system-ui, sans-serif" font-size="10.5" fill="#78350F">
      • Thuật toán ML gán nhãn dị thường cần phân biệt rõ: "Suy giảm do mây che" (biến thiên liên tục, hồi phục nhanh)
    </text>
    <text x="20" y="78" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#B45309">
      và "Sự cố hỏng diode / che bóng cố định" (sụt giảm dạng bước nhảy bậc thang 33.3% kéo dài nhiều ngày).
    </text>
  </g>
</svg>
