<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.1" />
    </filter>
    <linearGradient id="theoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="actGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

  <!-- Header -->
  <rect x="20" y="15" width="920" height="46" rx="8" fill="#0F172A" />
  <text x="480" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">
    SƠ ĐỒ PHÂN RÃ TỔN THẤT QUANG ĐIỆN (SOLAR PV LOSS DECOMPOSITION)
  </text>

  <!-- Top Block: Theoretical Energy STC -->
  <g transform="translate(180, 80)" filter="url(#shadow)">
    <rect width="600" height="50" rx="8" fill="url(#theoGrad)" />
    <text x="300" y="31" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      1. NĂNG LƯỢNG LÝ THUYẾT ĐẦU VÀO TẠI STC (100% - 1000 W/m², 25°C)
    </text>
  </g>

  <!-- Flow Line -->
  <line x1="480" y1="130" x2="480" y2="450" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Loss Step 1: IAM & Low Irradiance -->
  <g transform="translate(80, 150)">
    <line x1="200" y1="20" x2="400" y2="20" stroke="#F59E0B" stroke-width="2" />
    <circle cx="400" cy="20" r="5" fill="#F59E0B" />
    <rect x="0" y="0" width="370" height="40" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" />
    <text x="185" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle">
      - Tổn thất Bức xạ Thấp &amp; Góc Chiếu (IAM Loss: 2% - 4%)
    </text>
  </g>

  <!-- Loss Step 2: Soiling & Shading -->
  <g transform="translate(510, 205)">
    <line x1="-30" y1="20" x2="20" y2="20" stroke="#EA580C" stroke-width="2" />
    <circle cx="-30" cy="20" r="5" fill="#EA580C" />
    <rect x="0" y="0" width="370" height="40" rx="6" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" />
    <text x="185" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#C2410C" text-anchor="middle">
      - Tổn thất Bám Bụi &amp; Che Bóng (Soiling/Shading: 2% - 6%)
    </text>
  </g>

  <!-- Loss Step 3: Thermal Loss (BIGGEST) -->
  <g transform="translate(80, 260)">
    <line x1="200" y1="24" x2="400" y2="24" stroke="#DC2626" stroke-width="2" />
    <circle cx="400" cy="24" r="6" fill="#DC2626" />
    <rect x="0" y="0" width="370" height="48" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" filter="url(#shadow)" />
    <text x="185" y="19" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="middle">
      - Tổn thất Quá Nhiệt Tế bào Quang điện
    </text>
    <text x="185" y="35" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="middle">
      (Thermal Loss: 8% - 15% | γ = -0.35%/°C)
    </text>
  </g>

  <!-- Loss Step 4: DC Mismatch & Cables -->
  <g transform="translate(510, 320)">
    <line x1="-30" y1="20" x2="20" y2="20" stroke="#64748B" stroke-width="2" />
    <circle cx="-30" cy="20" r="5" fill="#64748B" />
    <rect x="0" y="0" width="370" height="40" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" />
    <text x="185" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">
      - Tổn thất Mismatched Module &amp; Cáp DC (1% - 2%)
    </text>
  </g>

  <!-- Loss Step 5: Inverter Clipping & Efficiency -->
  <g transform="translate(80, 380)">
    <line x1="200" y1="20" x2="400" y2="20" stroke="#7C3AED" stroke-width="2" />
    <circle cx="400" cy="20" r="5" fill="#7C3AED" />
    <rect x="0" y="0" width="370" height="40" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" />
    <text x="185" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6D28D9" text-anchor="middle">
      - Tổn thất Xén đỉnh &amp; Hiệu suất Inverter DC/AC (3% - 5%)
    </text>
  </g>

  <!-- Final Block: Actual Net Output -->
  <g transform="translate(180, 455)" filter="url(#shadow)">
    <rect width="600" height="60" rx="8" fill="url(#actGrad)" />
    <text x="300" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      2. SẢN LƯỢNG THỰC TẾ ĐO TẠI ĐỒNG HỒ ĐIỆN (NET AC GENERATION)
    </text>
    <text x="300" y="47" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#D1FAE5" text-anchor="middle">
      Performance Ratio (PR Thực tế: 75% - 85% | Toàn mạng UNISOLAR: 78.4%)
    </text>
  </g>
</svg>
