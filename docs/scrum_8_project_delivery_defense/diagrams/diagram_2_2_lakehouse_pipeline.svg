<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
    <marker id="arrPipe" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284C7" />
    </marker>
  </defs>

  <rect width="960" height="440" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header -->
  <rect x="20" y="15" width="920" height="40" rx="6" fill="#0F172A" />
  <text x="480" y="40" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">
    KIẾN TRÚC ĐƯỜNG ỐNG DỮ LIỆU LAKEHOUSE 6 LỚP (6-LAYER LAKEHOUSE PIPELINE)
  </text>

  <!-- Layer 1: Raw / Bronze -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="135" height="330" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" />
    <rect width="135" height="35" rx="6" fill="#64748B" />
    <text x="67" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">1. DATA SOURCE</text>
    <text x="10" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">Nguồn Dữ liệu Thô</text>
    <text x="10" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">• 5 File CSV Solar</text>
    <text x="10" y="98" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">(158 MB thô)</text>
    <text x="10" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">• Open-Meteo API</text>
    <text x="10" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">(8 biến khí quyển)</text>
    <text x="10" y="170" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0284C7">Bronze Layer:</text>
    <text x="10" y="190" font-family="system-ui, sans-serif" font-size="9" fill="#475569">S3 Object Storage</text>
    <text x="10" y="208" font-family="system-ui, sans-serif" font-size="9" fill="#475569">(Bất biến - Immutable)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 180 230 L 195 230" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrPipe)" />

  <!-- Layer 2: Staging -->
  <g transform="translate(200, 75)" filter="url(#shadow)">
    <rect width="135" height="330" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
    <rect width="135" height="35" rx="6" fill="#0284C7" />
    <text x="67" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">2. STAGING</text>
    <text x="10" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1">Tiếp nhận An toàn</text>
    <text x="10" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#0C4A6E">• `staging.stg_*`</text>
    <text x="10" y="98" font-family="system-ui, sans-serif" font-size="10" fill="#0C4A6E">• VARCHAR(255)</text>
    <text x="10" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#0C4A6E">• Khám phá &amp; Audit</text>
    <text x="10" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#0C4A6E">• Chặn lỗi Type Cast</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 340 230 L 355 230" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrPipe)" />

  <!-- Layer 3: Silver -->
  <g transform="translate(360, 75)" filter="url(#shadow)">
    <rect width="145" height="330" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" />
    <rect width="145" height="35" rx="6" fill="#16A34A" />
    <text x="72" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">3. SILVER BUFFER</text>
    <text x="10" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803D">Làm sạch &amp; Điền khuyết</text>
    <text x="10" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#14532D">• Floor-Hour Lookup</text>
    <text x="10" y="98" font-family="system-ui, sans-serif" font-size="10" fill="#14532D">• Causal Cascade</text>
    <text x="10" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#14532D">(linear/cubic/reg/night)</text>
    <text x="10" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#14532D">• GMM-IF ML Model</text>
    <text x="10" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#14532D">• 5 Physical Rules</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 510 230 L 525 230" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrPipe)" />

  <!-- Layer 4: Gold DWH -->
  <g transform="translate(530, 75)" filter="url(#shadow)">
    <rect width="140" height="330" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
    <rect width="140" height="35" rx="6" fill="#D97706" />
    <text x="70" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">4. GOLD DWH</text>
    <text x="10" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B45309">Galaxy Schema</text>
    <text x="10" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#78350F">• 2 Bảng Fact</text>
    <text x="10" y="98" font-family="system-ui, sans-serif" font-size="10" fill="#78350F">• 4 Conformed Dim</text>
    <text x="10" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#78350F">• Partition By Year</text>
    <text x="10" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#78350F">• Composite Index</text>
    <text x="10" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#78350F">• Surrogate Keys</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 675 230 L 690 230" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrPipe)" />

  <!-- Layer 5: Data Marts -->
  <g transform="translate(695, 75)" filter="url(#shadow)">
    <rect width="115" height="330" rx="6" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5" />
    <rect width="115" height="35" rx="6" fill="#7C3AED" />
    <text x="57" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">5. SERVING</text>
    <text x="8" y="60" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#6D28D9">Data Marts</text>
    <text x="8" y="80" font-family="system-ui, sans-serif" font-size="9" fill="#4C1D95">• BI Mart (MV)</text>
    <text x="8" y="98" font-family="system-ui, sans-serif" font-size="9" fill="#4C1D95">PgBouncer 6543</text>
    <text x="8" y="125" font-family="system-ui, sans-serif" font-size="9" fill="#4C1D95">• ML Mart</text>
    <text x="8" y="143" font-family="system-ui, sans-serif" font-size="9" fill="#4C1D95">Parquet format</text>
  </g>

  <!-- Arrow 5 -->
  <path d="M 815 230 L 830 230" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrPipe)" />

  <!-- Layer 6: Action -->
  <g transform="translate(835, 75)" filter="url(#shadow)">
    <rect width="90" height="330" rx="6" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.5" />
    <rect width="90" height="35" rx="6" fill="#DB2777" />
    <text x="45" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">6. BI / O&amp;M</text>
    <text x="6" y="60" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#BE185D">Tableau</text>
    <text x="6" y="78" font-family="system-ui, sans-serif" font-size="8" fill="#9D174D">3 Dashboards</text>
    <text x="6" y="115" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#BE185D">O&amp;M Actions</text>
    <text x="6" y="133" font-family="system-ui, sans-serif" font-size="8" fill="#9D174D">Lệnh bảo trì</text>
  </g>

</svg>
