<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F8FAFC; }
      .camp-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; }
      .camp-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="960" height="430" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header -->
  <rect x="20" y="15" width="920" height="40" rx="6" fill="#0F172A" />
  <text x="480" y="40" text-anchor="middle" class="hdr">
    BẢN ĐỒ PHÂN BỐ ĐỊA LÝ &amp; ĐẶC TRƯNG VI KHÍ HẬU 5 KHUÔN VIÊN ĐẠI HỌC LA TROBE (VICTORIA, ÚC)
  </text>

  <!-- 5 Campus Nodes -->
  <!-- 1. Mildura -->
  <g transform="translate(50, 70)" filter="url(#shadow)">
    <rect width="860" height="58" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" />
    <text x="15" y="24" class="camp-title" fill="#B45309">1. MILDURA CAMPUS [-34.22° S, 142.15° E]</text>
    <text x="15" y="44" class="camp-desc" fill="#78350F">Khí hậu Bán khô hạn nội địa (Mùa hè &gt;42°C, nắng gắt quanh năm) ── 2 trạm (100 kWp SunPower Mono-Si)</text>
    <rect x="730" y="14" width="115" height="30" rx="4" fill="#F59E0B" />
    <text x="787" y="33" text-anchor="middle" class="badge-txt">100 kWp (4.1%)</text>
  </g>

  <!-- 2. Shepparton -->
  <g transform="translate(50, 138)" filter="url(#shadow)">
    <rect width="860" height="58" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" />
    <text x="15" y="24" class="camp-title" fill="#15803D">2. SHEPPARTON CAMPUS [-36.38° S, 145.40° E]</text>
    <text x="15" y="44" class="camp-desc" fill="#14532D">Thung lũng Goulburn nông nghiệp (Bức xạ trực xạ DNI cao) ── 2 trạm (118 kWp Trina Mono-Si)</text>
    <rect x="730" y="14" width="115" height="30" rx="4" fill="#16A34A" />
    <text x="787" y="33" text-anchor="middle" class="badge-txt">118 kWp (4.9%)</text>
  </g>

  <!-- 3. Bendigo -->
  <g transform="translate(50, 206)" filter="url(#shadow)">
    <rect width="860" height="58" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
    <text x="15" y="24" class="camp-title" fill="#0369A1">3. BENDIGO CAMPUS [-36.78° S, 144.30° E]</text>
    <text x="15" y="44" class="camp-desc" fill="#0C4A6E">Vùng đồi trung du (Biên độ nhiệt ngày/đêm rất lớn) ── 10 trạm (580 kWp Jinko / Trina)</text>
    <rect x="730" y="14" width="115" height="30" rx="4" fill="#0284C7" />
    <text x="787" y="33" text-anchor="middle" class="badge-txt">580 kWp (23.9%)</text>
  </g>

  <!-- 4. Albury-Wodonga -->
  <g transform="translate(50, 274)" filter="url(#shadow)">
    <rect width="860" height="58" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" />
    <text x="15" y="24" class="camp-title" fill="#334155">4. ALBURY-WODONGA CAMPUS [-36.12° S, 146.96° E]</text>
    <text x="15" y="44" class="camp-desc" fill="#475569">Thung lũng sông Murray giáp dãy Alps (Mùa đông sương mù dày) ── 4 trạm (210 kWp SunPower)</text>
    <rect x="730" y="14" width="115" height="30" rx="4" fill="#64748B" />
    <text x="787" y="33" text-anchor="middle" class="badge-txt">210 kWp (8.6%)</text>
  </g>

  <!-- 5. Bundoora (Melbourne Main) -->
  <g transform="translate(50, 342)" filter="url(#shadow)">
    <rect width="860" height="68" rx="6" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2" />
    <text x="15" y="24" class="camp-title" fill="#6D28D9">5. BUNDOORA - MELBOURNE MAIN CAMPUS [-37.72° S, 145.05° E] (TRỤ SỞ CHÍNH)</text>
    <text x="15" y="44" class="camp-desc" fill="#4C1D95">Khí hậu Ôn đới Hải dương (Thời tiết biến đổi 4 mùa/ngày) ── 24 trạm (SunPower &amp; Trina)</text>
    <text x="15" y="58" class="camp-desc" font-size="9.5" fill="#6D28D9">• Trọng tâm phân tích dị thường của toàn dự án</text>
    <rect x="720" y="17" width="125" height="34" rx="4" fill="#7C3AED" />
    <text x="782" y="38" text-anchor="middle" class="badge-txt">1.420 kWp (58.5%)</text>
  </g>
</svg>
