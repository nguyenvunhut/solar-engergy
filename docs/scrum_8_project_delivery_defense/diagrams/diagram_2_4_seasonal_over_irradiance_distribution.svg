<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #F8FAFC; }
      .subhdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #334155; }
      .txt-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 700; fill: #0F172A; }
      .axis-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #64748B; }
      .val-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 700; fill: #B91C1C; }
      .formula { font-family: "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1060" height="580" fill="#F8FAFC" rx="10" />

  <!-- Header Banner -->
  <rect x="20" y="15" width="1020" height="46" rx="8" fill="#0F172A" />
  <text x="530" y="34" text-anchor="middle" class="hdr">PHÂN BỔ CHU KỲ 12 THÁNG CỦA CÁC SỰ KIỆN OVER-IRRADIANCE TẠI BÁN CẦU NAM (BANG VICTORIA, ÚC)</text>
  <text x="530" y="50" text-anchor="middle" class="subhdr">Tổng hợp 7.215 giờ có bức xạ GHI > 1.000 W/m² theo từng tháng trong năm từ CSDL thực nghiệm UNISOLAR</text>

  <!-- Left: Monthly Bar Chart -->
  <g transform="translate(20, 75)">
    <rect width="680" height="485" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect width="680" height="32" rx="8" fill="#FFF7ED" />
    <text x="340" y="21" text-anchor="middle" class="box-title" fill="#C2410C">TỔNG SỐ GIỜ GHI > 1.000 W/m² THEO TỪNG THÁNG TRONG CƠ SỞ DỮ LIỆU</text>

    <!-- Graph Canvas -->
    <g transform="translate(55, 45)">
      <!-- Y-Axis Gridlines & Labels -->
      <line x1="0" y1="330" x2="600" y2="330" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="0" y1="247" x2="600" y2="247" stroke="#F1F5F9" stroke-width="1" />
      <line x1="0" y1="165" x2="600" y2="165" stroke="#F1F5F9" stroke-width="1" />
      <line x1="0" y1="82" x2="600" y2="82" stroke="#F1F5F9" stroke-width="1" />
      <line x1="0" y1="0" x2="600" y2="0" stroke="#F1F5F9" stroke-width="1" />

      <text x="-10" y="334" text-anchor="end" class="axis-lbl">0</text>
      <text x="-10" y="251" text-anchor="end" class="axis-lbl">750</text>
      <text x="-10" y="169" text-anchor="end" class="axis-lbl">1.500</text>
      <text x="-10" y="86" text-anchor="end" class="axis-lbl">2.250</text>
      <text x="-10" y="4" text-anchor="end" class="axis-lbl" font-weight="700" fill="#B91C1C">3.000 h</text>

      <!-- 12 Month Bars (Southern Hemisphere Seasons) -->
      <!-- T1 (Jan - Summer peak) -->
      <g transform="translate(15, 0)">
        <rect x="0" y="10" width="34" height="320" rx="3" fill="#EF4444" />
        <text x="17" y="5" text-anchor="middle" class="val-lbl">2.907</text>
        <text x="17" y="348" text-anchor="middle" class="txt-bold" fill="#B91C1C">T1</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#991B1B">Hè</text>
      </g>

      <!-- T2 (Feb - Late Summer) -->
      <g transform="translate(64, 0)">
        <rect x="0" y="298" width="34" height="32" rx="3" fill="#F87171" />
        <text x="17" y="292" text-anchor="middle" class="val-lbl">292</text>
        <text x="17" y="348" text-anchor="middle" class="txt-bold">T2</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#64748B">Hè</text>
      </g>

      <!-- T3 (Mar - Autumn) -->
      <g transform="translate(113, 0)">
        <rect x="0" y="328" width="34" height="2" rx="1" fill="#94A3B8" />
        <text x="17" y="322" text-anchor="middle" class="axis-lbl">0</text>
        <text x="17" y="348" text-anchor="middle" class="axis-lbl">T3</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#64748B">Thu</text>
      </g>

      <!-- T4 (Apr - Autumn) -->
      <g transform="translate(162, 0)">
        <rect x="0" y="328" width="34" height="2" rx="1" fill="#94A3B8" />
        <text x="17" y="322" text-anchor="middle" class="axis-lbl">0</text>
        <text x="17" y="348" text-anchor="middle" class="axis-lbl">T4</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#64748B">Thu</text>
      </g>

      <!-- T5 (May - Autumn/Winter) -->
      <g transform="translate(211, 0)">
        <rect x="0" y="328" width="34" height="2" rx="1" fill="#94A3B8" />
        <text x="17" y="322" text-anchor="middle" class="axis-lbl">0</text>
        <text x="17" y="348" text-anchor="middle" class="axis-lbl">T5</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#64748B">Thu</text>
      </g>

      <!-- T6 (Jun - Winter solstice) -->
      <g transform="translate(260, 0)">
        <rect x="0" y="328" width="34" height="2" rx="1" fill="#0284C7" />
        <text x="17" y="322" text-anchor="middle" class="axis-lbl">0</text>
        <text x="17" y="348" text-anchor="middle" class="axis-lbl" fill="#0369A1">T6</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#0369A1">Đông</text>
      </g>

      <!-- T7 (Jul - Winter coldest) -->
      <g transform="translate(309, 0)">
        <rect x="0" y="328" width="34" height="2" rx="1" fill="#0284C7" />
        <text x="17" y="322" text-anchor="middle" class="axis-lbl">0</text>
        <text x="17" y="348" text-anchor="middle" class="axis-lbl" fill="#0369A1">T7</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#0369A1">Đông</text>
      </g>

      <!-- T8 (Aug - Late Winter) -->
      <g transform="translate(358, 0)">
        <rect x="0" y="328" width="34" height="2" rx="1" fill="#0284C7" />
        <text x="17" y="322" text-anchor="middle" class="axis-lbl">0</text>
        <text x="17" y="348" text-anchor="middle" class="axis-lbl" fill="#0369A1">T8</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#0369A1">Đông</text>
      </g>

      <!-- T9 (Sep - Early Spring) -->
      <g transform="translate(407, 0)">
        <rect x="0" y="328" width="34" height="2" rx="1" fill="#10B981" />
        <text x="17" y="322" text-anchor="middle" class="axis-lbl">0</text>
        <text x="17" y="348" text-anchor="middle" class="axis-lbl">T9</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#047857">Xuân</text>
      </g>

      <!-- T10 (Oct - Spring) -->
      <g transform="translate(456, 0)">
        <rect x="0" y="324" width="34" height="6" rx="2" fill="#F59E0B" />
        <text x="17" y="318" text-anchor="middle" class="val-lbl">57</text>
        <text x="17" y="348" text-anchor="middle" class="txt-bold">T10</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#047857">Xuân</text>
      </g>

      <!-- T11 (Nov - Late Spring) -->
      <g transform="translate(505, 0)">
        <rect x="0" y="218" width="34" height="112" rx="3" fill="#EA580C" />
        <text x="17" y="212" text-anchor="middle" class="val-lbl">1.018</text>
        <text x="17" y="348" text-anchor="middle" class="txt-bold" fill="#EA580C">T11</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#047857">Xuân</text>
      </g>

      <!-- T12 (Dec - Summer Solstice) -->
      <g transform="translate(554, 0)">
        <rect x="0" y="6" width="34" height="324" rx="3" fill="#DC2626" />
        <text x="17" y="1" text-anchor="middle" class="val-lbl">2.941</text>
        <text x="17" y="348" text-anchor="middle" class="txt-bold" fill="#B91C1C">T12</text>
        <text x="17" y="360" text-anchor="middle" class="txt" font-size="8" fill="#991B1B">Hè</text>
      </g>

      <!-- Season Brackets aligned under bars -->
      <rect x="10" y="375" width="93" height="20" rx="3" fill="#FEF2F2" stroke="#EF4444" />
      <text x="56" y="389" text-anchor="middle" class="txt-bold" font-size="8" fill="#B91C1C">MÙA HÈ: 44,1%</text>

      <rect x="108" y="375" width="142" height="20" rx="3" fill="#F8FAFC" stroke="#CBD5E1" />
      <text x="179" y="389" text-anchor="middle" class="txt" font-size="8" fill="#64748B">MÙA THU: 0,0%</text>

      <rect x="255" y="375" width="142" height="20" rx="3" fill="#F0F9FF" stroke="#BAE6FD" />
      <text x="326" y="389" text-anchor="middle" class="txt" font-size="8" fill="#0369A1">MÙA ĐÔNG: 0,0%</text>

      <rect x="402" y="375" width="142" height="20" rx="3" fill="#ECFDF5" stroke="#A7F3D0" />
      <text x="473" y="389" text-anchor="middle" class="txt" font-size="8" fill="#047857">MÙA XUÂN: 14,9%</text>

      <rect x="549" y="375" width="44" height="20" rx="3" fill="#FEF2F2" stroke="#EF4444" />
      <text x="571" y="389" text-anchor="middle" class="txt-bold" font-size="8" fill="#B91C1C">40,8%</text>
    </g>
  </g>

  <!-- Right: Season Insight & Atmospheric Physics -->
  <g transform="translate(715, 75)">
    <rect width="325" height="485" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" />
    <rect width="325" height="32" rx="8" fill="#FEF3C7" />
    <text x="162" y="21" text-anchor="middle" class="box-title" fill="#B45309">QUY LUẬT NHẬT QUỸ BÁN CẦU NAM</text>

    <g transform="translate(15, 45)">
      <rect width="295" height="120" rx="6" fill="#FEF2F2" stroke="#FECACA" />
      <text x="12" y="18" class="txt-bold" fill="#991B1B">MÙA HÈ (THÁNG 12 – THÁNG 1):</text>
      <text x="12" y="36" class="txt">• Chiếm <tspan class="txt-bold" fill="#B91C1C">84,9% tổng số giờ Over-irradiance</tspan> cả năm.</text>
      <text x="12" y="52" class="txt">• Góc cao mặt trời đạt cực đại (h_noon ≈ 75° - 78°).</text>
      <text x="12" y="68" class="txt">• Bức xạ nền trong vắt vượt 900 W/m² tạo tiền đề</text>
      <text x="12" y="84" class="txt">  cho mép mây kích hoạt xung chạm 1.109 W/m².</text>
      <text x="12" y="100" class="txt">• Đối lưu nhiệt sinh mây tích Cumulus buổi trưa.</text>
    </g>

    <g transform="translate(15, 175)">
      <rect width="295" height="115" rx="6" fill="#F0F9FF" stroke="#BAE6FD" />
      <text x="12" y="18" class="txt-bold" fill="#0369A1">MÙA THU &amp; ĐÔNG (THÁNG 3 – THÁNG 9):</text>
      <text x="12" y="36" class="txt">• <tspan class="txt-bold" fill="#0369A1">Số giờ GHI &gt; 1.000 W/m² = 0 giờ tuyệt đối.</tspan></text>
      <text x="12" y="52" class="txt">• Góc cao mặt trời cực thấp (h_noon &lt; 35°).</text>
      <text x="12" y="68" class="txt">• Đường đi quang học qua khí quyển dài (Air Mass</text>
      <text x="12" y="84" class="txt">  AM &gt; 1.8), bức xạ nền chỉ đạt 400 - 650 W/m².</text>
      <text x="12" y="100" class="txt">• Dù có mép mây cũng không đủ chạm 1.000 W/m².</text>
    </g>

    <g transform="translate(15, 300)">
      <rect width="295" height="155" rx="6" fill="#FFFBEB" stroke="#FDE68A" />
      <text x="12" y="18" class="txt-bold" fill="#92400E">Ý NGHĨA CHO MÔ HÌNH HỌC MÁY (ML):</text>
      <text x="12" y="36" class="txt">• Mã hóa chu kỳ lượng giác <tspan class="formula">sin/cos(month)</tspan> giúp</text>
      <text x="12" y="52" class="txt">  mô hình nắm bắt chính xác quy luật mùa vụ.</text>
      <text x="12" y="68" class="txt">• Dự báo phụ tải điều hòa HVAC và trạm sạc EV</text>
      <text x="12" y="84" class="txt">  phải tính toán hệ số công suất đỉnh mùa hè</text>
      <text x="12" y="100" class="txt">  vượt mức thiết kế do Over-irradiance.</text>
      <text x="12" y="116" class="txt">• Ngăn chặn cảnh báo dị thường sai lệch mùa đông.</text>
    </g>
  </g>
</svg>
