<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="960" height="460" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Header -->
  <rect x="20" y="15" width="920" height="42" rx="6" fill="#0F172A" />
  <text x="480" y="41" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">
    BẢN CHẤT VÀ MỐI QUAN HỆ GIỮA 4 ĐẠI LƯỢNG ĐIỆN NĂNG CỐT LÕI (V, A, W, kWh)
  </text>

  <!-- 4 Cards -->
  <!-- Card 1: Voltage -->
  <g transform="translate(30, 75)" filter="url(#shadow)">
    <rect width="210" height="360" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5" />
    <rect width="210" height="36" rx="8" fill="#0284C7" />
    <text x="105" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">1. ĐIỆN ÁP (Volt - V)</text>
    
    <text x="12" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1">Hiệu điện thế</text>
    <text x="12" y="78" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Lực điện trường thúc đẩy</text>
    <text x="12" y="92" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">các electron dịch chuyển.</text>
    
    <!-- Box content -->
    <rect x="12" y="110" width="186" height="110" rx="4" fill="#E0F2FE" stroke="#0284C7" />
    <text x="105" y="135" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0369A1" text-anchor="middle">Điện áp Chuỗi (String)</text>
    <text x="105" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#0284C7" text-anchor="middle">V_string = Σ V_module</text>
    <text x="105" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1" text-anchor="middle">600V - 800V DC</text>

    <text x="12" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0C4A6E">Đặc tính Vật lý:</text>
    <text x="12" y="265" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Tăng theo số tấm mắc nối tiếp</text>
    <text x="12" y="285" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Giảm khi nhiệt độ cell tăng cao</text>
    <text x="12" y="305" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Hệ số nhiệt γ = -0.35%/°C</text>
  </g>

  <!-- Card 2: Current -->
  <g transform="translate(260, 75)" filter="url(#shadow)">
    <rect width="210" height="360" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" />
    <rect width="210" height="36" rx="8" fill="#16A34A" />
    <text x="105" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">2. DÒNG ĐIỆN (Ampe - A)</text>
    
    <text x="12" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803D">Cường độ dòng điện</text>
    <text x="12" y="78" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Lượng electron dịch chuyển</text>
    <text x="12" y="92" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">qua tiết diện dây dẫn trong 1s.</text>
    
    <!-- Box content -->
    <rect x="12" y="110" width="186" height="110" rx="4" fill="#DCFCE7" stroke="#16A34A" />
    <text x="105" y="135" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">Dòng Quang sinh I_ph</text>
    <text x="105" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#16A34A" text-anchor="middle">I tỷ lệ thuận với GHI</text>
    <text x="105" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">8A - 13A DC</text>

    <text x="12" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#14532D">Đặc tính Vật lý:</text>
    <text x="12" y="265" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Tỷ lệ thuận tuyến tính với GHI</text>
    <text x="12" y="285" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Bị giới hạn bởi cell che bóng nhất</text>
    <text x="12" y="305" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Tăng khi mắc mảng song song</text>
  </g>

  <!-- Card 3: Power -->
  <g transform="translate(490, 75)" filter="url(#shadow)">
    <rect width="210" height="360" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
    <rect width="210" height="36" rx="8" fill="#D97706" />
    <text x="105" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">3. CÔNG SUẤT (Watt / kW)</text>
    
    <text x="12" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B45309">Công suất tức thời</text>
    <text x="12" y="78" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Tốc độ chuyển hóa năng lượng</text>
    <text x="12" y="92" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">tại 1 thời điểm: P = V × I.</text>
    
    <!-- Box content -->
    <rect x="12" y="110" width="186" height="110" rx="4" fill="#FEF3C7" stroke="#D97706" />
    <text x="105" y="135" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">Công suất Thực phát</text>
    <text x="105" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#D97706" text-anchor="middle">P_mp = V_mp × I_mp</text>
    <text x="105" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Dải: 10kW - 320kW</text>

    <text x="12" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#78350F">Đặc tính Vận hành:</text>
    <text x="12" y="265" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Đạt cực đại lúc giữa trưa (MPP)</text>
    <text x="12" y="285" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Bị xén nếu vượt định mức Inverter</text>
    <text x="12" y="305" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Tối ưu liên tục bởi MPPT</text>
  </g>

  <!-- Card 4: Energy -->
  <g transform="translate(720, 75)" filter="url(#shadow)">
    <rect width="210" height="360" rx="8" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5" />
    <rect width="210" height="36" rx="8" fill="#7C3AED" />
    <text x="105" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">4. SẢN LƯỢNG (kWh)</text>
    
    <text x="12" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6D28D9">Điện năng tích lũy</text>
    <text x="12" y="78" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Tổng năng lượng phát ra</text>
    <text x="12" y="92" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">trong 1 khoảng thời gian.</text>
    
    <!-- Box content -->
    <rect x="12" y="110" width="186" height="110" rx="4" fill="#EDE9FE" stroke="#7C3AED" />
    <text x="105" y="135" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">Trường Database</text>
    <text x="105" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#7C3AED" text-anchor="middle">E = ∫ P dt (15 phút)</text>
    <text x="105" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">energy_kwh</text>

    <text x="12" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#4C1D95">Ý nghĩa Nghiệp vụ:</text>
    <text x="12" y="265" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Cơ sở tính toán doanh thu FiT</text>
    <text x="12" y="285" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Thước đo hiệu quả đầu tư ROI</text>
    <text x="12" y="305" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Đối soát hóa đơn năng lượng</text>
  </g>
</svg>
