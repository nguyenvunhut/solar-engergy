<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #F8FAFC; letter-spacing: 0.5px; }
      .subhdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #94A3B8; }
      .side-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #334155; }
      .txt-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 700; fill: #0F172A; }
      .txt-small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.5px; fill: #64748B; }
      .formula { font-family: "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; }
      .kpi-big { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 800; }
    </style>

    <!-- Filters -->
    <filter id="boxShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>

    <!-- Markers -->
    <marker id="arrCoolWind" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#0284C7" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="sunRayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="panelGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="trappedHeatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="660" fill="#F8FAFC" rx="10" />

  <!-- Header Banner -->
  <rect x="20" y="14" width="1040" height="48" rx="8" fill="url(#hdrGrad)" />
  <text x="540" y="34" text-anchor="middle" class="hdr">CƠ CHẾ TẢN NHIỆT ĐỐI LƯU TỰ NHIÊN &amp; KHOẢNG HỞ THÔNG GIÓ MÁI 10 - 15 CM (AS/NZS 5033:2021)</text>
  <text x="540" y="50" text-anchor="middle" class="subhdr">Áp dụng cho mọi cấu trúc mái tòa nhà: Mái kim loại / Mái bằng bê tông / Mái ngói (Chuẩn Sandia &amp; NREL)</text>

  <!-- 2 COMPARATIVE SIDES -->
  <g transform="translate(20, 70)">

    <!-- ==================== LEFT SIDE: FLUSH-MOUNT TRAP ==================== -->
    <g transform="translate(0, 0)" filter="url(#boxShadow)">
      <rect width="505" height="570" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8" />
      <rect width="505" height="32" rx="8" fill="#FEF2F2" />
      <text x="252" y="21" text-anchor="middle" class="side-title" fill="#DC2626">⚠️ HIỆN TRẠNG: LẮP ÁP SÁT MẶT MÁI TÒA NHÀ (KHE HỞ &lt; 20mm)</text>

      <!-- VISUAL CROSS-SECTION GRAPHIC (LEFT) -->
      <g transform="translate(15, 42)">
        <rect width="475" height="210" rx="6" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.2" />

        <!-- Sun Rays -->
        <circle cx="40" cy="22" r="14" fill="url(#sunRayGrad)" />
        <path d="M 65 15 L 110 50 M 130 10 L 175 50 M 210 10 L 255 50 M 290 10 L 335 50 M 370 10 L 415 50" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 3" />
        <text x="250" y="24" class="txt-bold" fill="#D97706">Bức Xạ Nắng Gắt Mùa Hè (GHI &gt; 1.000 W/m²)</text>

        <!-- Solar PV Panel Cross Section -->
        <rect x="35" y="55" width="405" height="24" rx="3" fill="url(#panelGlass)" stroke="#475569" stroke-width="1.5" />
        <rect x="42" y="60" width="70" height="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="0.8" />
        <rect x="117" y="60" width="70" height="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="0.8" />
        <rect x="192" y="60" width="70" height="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="0.8" />
        <rect x="267" y="60" width="70" height="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="0.8" />
        <rect x="342" y="60" width="70" height="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="0.8" />
        <line x1="40" y1="58" x2="435" y2="58" stroke="#93C5FD" stroke-width="1" />

        <!-- Trapped Air Chamber -->
        <rect x="35" y="79" width="405" height="22" fill="url(#trappedHeatGrad)" />
        <text x="237" y="94" text-anchor="middle" font-size="8.5px" font-weight="800" fill="#FEF2F2">🔥 KHÔNG KHÍ BỊ NGHẼN TRONG KHE HỞ &lt; 20mm (KHÔNG CÓ GIÓ LƯU THÔNG)</text>

        <!-- General Building Rooftop Structure (Metal Deck / Concrete Slab / Membrane) -->
        <path d="M 25 106 Q 38 98 50 106 T 75 106 T 100 106 T 125 106 T 150 106 T 175 106 T 200 106 T 225 106 T 250 106 T 275 106 T 300 106 T 325 106 T 350 106 T 375 106 T 400 106 T 425 106 T 450 106" fill="none" stroke="#64748B" stroke-width="2" />
        <rect x="25" y="108" width="425" height="16" fill="#CBD5E1" />
        <text x="237" y="120" text-anchor="middle" class="txt-bold" fill="#475569">Mặt Mái Tòa Nhà: Mái Kim Loại / Bê Tông / Ngói (Hấp Thụ &amp; Tích Nhiệt 70°C - 75°C)</text>

        <!-- Red Alert Thermometer Graphic & Voc Drop Box -->
        <g transform="translate(30, 130)">
          <rect x="0" y="0" width="195" height="70" rx="4" fill="#FEF2F2" stroke="#F87171" />
          <circle cx="22" cy="50" r="10" fill="#DC2626" />
          <rect x="18" y="16" width="8" height="34" rx="4" fill="#DC2626" />
          <rect x="19" y="10" width="6" height="10" rx="3" fill="#FECACA" />
          <text x="42" y="20" class="txt-bold" fill="#DC2626">NHIỆT ĐỘ CELL PIN:</text>
          <text x="42" y="38" class="kpi-big" fill="#DC2626">T_cell = 68°C - 72°C</text>
          <text x="42" y="56" class="txt-small" fill="#991B1B">(ΔT = +43°C so với chuẩn 25°C)</text>

          <!-- IV Curve Miniature -->
          <g transform="translate(205, 0)">
            <rect x="0" y="0" width="205" height="70" rx="4" fill="#FFFFFF" stroke="#FECDD3" />
            <text x="8" y="14" class="txt-bold" fill="#DC2626">📉 Sụt Giảm Điện Áp Voc:</text>
            <!-- Curve drawn in upper right quadrant -->
            <path d="M 130 28 L 175 28 Q 185 28, 188 36" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" />
            <path d="M 130 28 L 160 28 Q 168 28, 172 36" fill="none" stroke="#DC2626" stroke-width="1.8" />
            <text x="160" y="20" font-size="7px" fill="#DC2626" font-weight="700">Tụt 16,3%</text>
            <text x="8" y="30" class="txt-small">Điện áp Voc tụt: 48V ➔ 39V</text>
            <text x="8" y="46" class="formula" fill="#DC2626">Công suất P = V × I sụp đổ</text>
            <text x="8" y="60" class="txt-small" fill="#991B1B">Mất 14,8% sản lượng/năm</text>
          </g>
        </g>
      </g>

      <!-- QUANTITATIVE METRICS (LEFT) -->
      <g transform="translate(15, 262)">
        <rect width="475" height="295" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="15" y="20" class="txt-bold" fill="#DC2626">HỆ QUẢ KỸ THUẬT &amp; THIỆT HẠI KINH TẾ (BASELINE):</text>

        <g transform="translate(15, 30)">
          <rect width="445" height="62" rx="4" fill="#FFFFFF" stroke="#FEE2E2" />
          <text x="10" y="16" class="txt-bold" fill="#0F172A">1. Định Luật Bán Dẫn &amp; Mô Hình Ross / Sandia:</text>
          <text x="20" y="32" class="txt">• Hệ số nhiệt công suất: γ = -0,38% / °C (Silicon Monocrystalline)</text>
          <text x="20" y="46" class="txt">• Suy hao tức thời giữa trưa hè: 43°C × 0,38% = 16,34% công suất</text>
          <text x="20" y="56" class="formula" fill="#DC2626">Hiệu suất PR trưa hè sụt giảm nghiêm trọng từ 83% xuống 69%</text>
        </g>

        <g transform="translate(15, 100)">
          <rect width="445" height="65" rx="4" fill="#FFFFFF" stroke="#FEE2E2" />
          <text x="10" y="16" class="txt-bold" fill="#0F172A">2. Tổng Thiệt Hại Năng Lượng &amp; Tài Chính Năm:</text>
          <text x="20" y="32" class="txt">• Tỷ trọng tổn thất nhiệt toàn hệ thống: 14,8% tổng sản lượng</text>
          <text x="20" y="46" class="txt-bold" fill="#DC2626">• Điện năng bốc hơi: 510.300 kWh / Năm (42.525 kWh / Tháng)</text>
          <text x="20" y="58" class="formula" fill="#DC2626">THIỆT HẠI: ~102.060 AUD / NĂM (Đơn giá 0,20 AUD/kWh)</text>
        </g>

        <g transform="translate(15, 173)">
          <rect width="445" height="58" rx="4" fill="#FFFFFF" stroke="#FEE2E2" />
          <text x="10" y="16" class="txt-bold" fill="#0F172A">3. Suy Thoái Phần Cứng &amp; Tích Nhiệt Mái Tòa Nhà:</text>
          <text x="20" y="30" class="txt">• Mái bê tông tích nhiệt lớn, mái tôn bức xạ mạnh đều nung nóng đáy pin</text>
          <text x="20" y="44" class="txt">• Lão hóa nhanh lớp màng EVA và suy giảm tuổi thọ tấm pin từ 25 ➔ 16 năm</text>
        </g>

        <rect x="15" y="240" width="445" height="42" rx="4" fill="#FEF2F2" stroke="#DC2626" />
        <text x="222" y="256" text-anchor="middle" class="txt-bold" fill="#DC2626">ĐÁNH GIÁ: LẮP ÁP SÁT MÁI LÀ NGUYÊN NHÂN SỐ 1 GÂY SUY THOÁI NHIỆT</text>
        <text x="222" y="272" text-anchor="middle" class="txt-small" fill="#991B1B">Bất kể là mái tôn, mái bằng bê tông hay mái ngói đều cần khe hở đối lưu</text>
      </g>
    </g>

    <!-- ==================== RIGHT SIDE: ELEVATED VENTILATION MOUNT ==================== -->
    <g transform="translate(535, 0)" filter="url(#boxShadow)">
      <rect width="505" height="570" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" />
      <rect width="505" height="32" rx="8" fill="#ECFDF5" />
      <text x="252" y="21" text-anchor="middle" class="side-title" fill="#047857">✨ ĐỀ XUẤT: NÂNG KHOẢNG HỞ THÔNG GIÓ 10 - 15 CM (AS/NZS 5033:2021)</text>

      <!-- VISUAL CROSS-SECTION GRAPHIC (RIGHT) -->
      <g transform="translate(15, 42)">
        <rect width="475" height="210" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />

        <!-- Sun Rays -->
        <circle cx="40" cy="22" r="14" fill="url(#sunRayGrad)" />
        <path d="M 65 15 L 110 50 M 130 10 L 175 50 M 210 10 L 255 50 M 290 10 L 335 50 M 370 10 L 415 50" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 3" />
        <text x="250" y="24" class="txt-bold" fill="#059669">Tấm Pin Được Làm Mát Nhờ Gió Đối Lưu Tự Nhiên</text>

        <!-- Elevated Solar PV Panel Cross Section -->
        <rect x="35" y="46" width="405" height="24" rx="3" fill="url(#panelGlass)" stroke="#059669" stroke-width="1.5" />
        <rect x="42" y="51" width="70" height="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="0.8" />
        <rect x="117" y="51" width="70" height="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="0.8" />
        <rect x="192" y="51" width="70" height="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="0.8" />
        <rect x="267" y="51" width="70" height="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="0.8" />
        <rect x="342" y="51" width="70" height="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="0.8" />

        <!-- Aerodynamic Wind Streamlines (150mm Gap) -->
        <path d="M 15 95 C 65 92, 115 78, 165 82 S 265 92, 315 80 S 415 88, 465 72" fill="none" stroke="#0284C7" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#arrCoolWind)" />
        <path d="M 15 105 C 75 100, 135 88, 195 92 S 295 100, 355 88 S 435 95, 465 82" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 3" />
        
        <!-- Aluminum Mounting Brackets -->
        <rect x="75" y="70" width="12" height="36" rx="2" fill="#94A3B8" stroke="#475569" />
        <rect x="235" y="70" width="12" height="36" rx="2" fill="#94A3B8" stroke="#475569" />
        <rect x="395" y="70" width="12" height="36" rx="2" fill="#94A3B8" stroke="#475569" />
        <text x="241" y="92" text-anchor="middle" font-size="7.5px" font-weight="700" fill="#0F172A">150mm</text>

        <!-- General Building Rooftop Line -->
        <path d="M 25 106 Q 38 98 50 106 T 75 106 T 100 106 T 125 106 T 150 106 T 175 106 T 200 106 T 225 106 T 250 106 T 275 106 T 300 106 T 325 106 T 350 106 T 375 106 T 400 106 T 425 106 T 450 106" fill="none" stroke="#64748B" stroke-width="2" />
        <rect x="25" y="108" width="425" height="16" fill="#CBD5E1" />
        <text x="237" y="120" text-anchor="middle" class="txt-bold" fill="#475569">Mặt Mái Tòa Nhà (Nhiệt Lượng Được Gió Thổi Bay, Không Truyền Ngược Vào Pin)</text>

        <!-- Green Thermometer Graphic & Restored Voc Curve -->
        <g transform="translate(30, 130)">
          <rect x="0" y="0" width="195" height="70" rx="4" fill="#ECFDF5" stroke="#6EE7B7" />
          <circle cx="22" cy="50" r="10" fill="#059669" />
          <rect x="18" y="24" width="8" height="26" rx="4" fill="#059669" />
          <rect x="19" y="10" width="6" height="18" rx="3" fill="#A7F3D0" />
          <text x="42" y="20" class="txt-bold" fill="#047857">NHIỆT ĐỘ CELL ĐÃ HẠ:</text>
          <text x="42" y="38" class="kpi-big" fill="#047857">T_cell = 59°C (Hạ 9°C!)</text>
          <text x="42" y="56" class="txt-small" fill="#065F46">(Cơ chế đối lưu tự nhiên AS/NZS 5033)</text>

          <!-- Restored Curve Miniature -->
          <g transform="translate(205, 0)">
            <rect x="0" y="0" width="205" height="70" rx="4" fill="#FFFFFF" stroke="#BBF7D0" />
            <text x="8" y="14" class="txt-bold" fill="#047857">📈 Phục Hồi Hiệu Suất:</text>
            <!-- Curve drawn in upper right quadrant -->
            <path d="M 130 28 L 180 28 Q 188 28, 192 36" fill="none" stroke="#059669" stroke-width="2.2" />
            <text x="155" y="20" font-size="7px" fill="#047857" font-weight="700">+3,42% CS</text>
            <text x="8" y="30" class="txt-small">Điện áp Voc phục hồi: 45.5V</text>
            <text x="8" y="46" class="formula" fill="#047857">+117.224 kWh/Năm Thu Hồi</text>
            <text x="8" y="60" class="txt-small" fill="#047857">+23.445 AUD/Năm Tiết Kiệm</text>
          </g>
        </g>
      </g>

      <!-- QUANTITATIVE METRICS (RIGHT) -->
      <g transform="translate(15, 262)">
        <rect width="475" height="295" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="15" y="20" class="txt-bold" fill="#047857">TÍNH TOÁN ĐỊNH LƯỢNG HIỆU QUẢ CẢI TIẾN &amp; HOÀN VỐN:</text>

        <g transform="translate(15, 30)">
          <rect width="445" height="62" rx="4" fill="#FFFFFF" stroke="#A7F3D0" />
          <text x="10" y="16" class="txt-bold" fill="#0F172A">1. Mức Hạ Nhiệt Độ Thực Chứng (AS/NZS 5033 &amp; King et al.):</text>
          <text x="20" y="32" class="txt">• Khoảng hở 150mm kích hoạt hiệu ứng ống khói (Chimney Convection)</text>
          <text x="20" y="46" class="txt">• Nhiệt độ cell pin hạ trung bình: ΔT_cell = -9,0°C (từ 68°C ➔ 59°C)</text>
          <text x="20" y="56" class="formula" fill="#059669">Hiệu suất tức thời tăng: 9,0°C × 0,38% = +3,42%</text>
        </g>

        <g transform="translate(15, 100)">
          <rect width="445" height="65" rx="4" fill="#FFFFFF" stroke="#A7F3D0" />
          <text x="10" y="16" class="txt-bold" fill="#0F172A">2. Năng Lượng &amp; Giá Trị Tài Chính Thu Hồi Hàng Năm:</text>
          <text x="20" y="32" class="txt-bold" fill="#047857">• Điện năng thu hồi cả năm: +117.224 kWh / Năm (+3,40% tổng năm)</text>
          <text x="20" y="46" class="txt">• Bình quân hàng tháng: 9.769 kWh / Tháng (Mùa hè: ~16.450 kWh/tháng)</text>
          <text x="20" y="58" class="formula" fill="#059669">+23.445 AUD / NĂM TIẾT KIỆM (1.954 AUD / Tháng)</text>
        </g>

        <g transform="translate(15, 173)">
          <rect width="445" height="58" rx="4" fill="#FFFFFF" stroke="#A7F3D0" />
          <text x="10" y="16" class="txt-bold" fill="#0F172A">3. Dự Toán Chi Phí &amp; Thời Gian Hoàn Vốn (Payback):</text>
          <text x="20" y="30" class="txt">• Chi phí lắp chân giá đỡ cao 150mm: ~10 AUD/kWp ➔ CapEx = 24.280 AUD</text>
          <text x="20" y="46" class="txt-bold" fill="#047857">• THỜI GIAN HOÀN VỐN: 24.280 / 23.445 = 1,035 NĂM (~12,4 THÁNG)!</text>
        </g>

        <rect x="15" y="240" width="445" height="42" rx="4" fill="#ECFDF5" stroke="#059669" />
        <text x="222" y="256" text-anchor="middle" class="txt-bold" fill="#047857">KẾT LUẬN: HOÀN VỐN SAU 1 NĂM VÀ SINH LỜI 23.445 AUD/NĂM SUỐT 25 NĂM</text>
        <text x="222" y="272" text-anchor="middle" class="txt-small" fill="#065F46">Đây là giải pháp cải tạo vật lý có tỷ suất sinh lời (ROI) cao nhất toàn bộ dự án</text>
      </g>
    </g>
  </g>
</svg>
