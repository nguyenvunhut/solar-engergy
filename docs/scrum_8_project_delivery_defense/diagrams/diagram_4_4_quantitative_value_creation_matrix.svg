      <text x="16" y="44" class="kpi-num" fill="#B45309">3,15 Năm (~38 Tháng)</text>
      <text x="16" y="58" class="txt-small" fill="#854D0E">(CapEx: ~1.312.780 AUD | IRR: 28,4%)</text>
    </g>

