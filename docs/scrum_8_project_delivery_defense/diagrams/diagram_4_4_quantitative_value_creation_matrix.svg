      <text x="16" y="44" class="kpi-num" fill="#6366F1">-986 Tấn CO2 / Năm</text>
      <text x="16" y="58" class="txt-small" fill="#4338CA">(Tương đương trồng ~45.000 cây xanh)</text>
    </g>
  </g>

  <!-- MASTER TABLE INFOGRAPHIC -->
