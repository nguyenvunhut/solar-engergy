      <text x="475" y="50" text-anchor="middle" font-size="13px" font-weight="800" fill="#4ADE80">—</text>

      <!-- Col 5: Clear separated center x=575 -->
      <text x="575" y="40" text-anchor="middle" font-size="12px" font-weight="800" fill="#38BDF8">+1.072.220 kWh / Năm</text>
      <text x="575" y="58" text-anchor="middle" font-size="9.5px" fill="#94A3B8">(+89.349 kWh / Tháng)</text>

      <!-- Col 6: Clear separated center x=715 -->
      <text x="715" y="40" text-anchor="middle" font-size="12.5px" font-weight="800" fill="#4ADE80">+416.169 AUD / NĂM</text>
