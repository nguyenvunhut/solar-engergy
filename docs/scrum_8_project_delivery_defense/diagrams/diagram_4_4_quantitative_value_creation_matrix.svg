      <text x="16" y="44" class="kpi-num" fill="#0284C7">+1.072.220 kWh / Năm</text>
      <text x="16" y="58" class="txt-small" fill="#0369A1">(Bình quân +89.349 kWh / Tháng)</text>
    </g>

