      <rect width="5" height="68" rx="3" fill="#4F46E5" />
      <circle cx="225" cy="34" r="16" fill="#EEF2FF" stroke="#818CF8" stroke-width="1" />
      <text x="225" y="38" text-anchor="middle" font-size="12px">🌱</text>
