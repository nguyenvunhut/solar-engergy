  <text x="540" y="34" text-anchor="middle" class="hdr">MA TRẬN ĐỊNH LƯỢNG GIÁ TRỊ TÀI CHÍNH &amp; THU HỒI NĂNG LƯỢNG TOÀN DIỆN DỰ ÁN</text>
  <text x="540" y="50" text-anchor="middle" class="subhdr">Tổng hợp 7 trụ cột đề xuất: Thu hồi +1.072.220 kWh/năm ➔ Tiết kiệm +416.169 AUD/năm ➔ Hoàn vốn bình quân 3,15 Năm</text>

  <!-- 4 TOP EXECUTIVE KPI CARDS -->
  <g transform="translate(20, 70)">
    <!-- KPI 1 -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
