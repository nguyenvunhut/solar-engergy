<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" />
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="540" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

  <!-- Header -->
  <rect x="20" y="20" width="900" height="50" rx="8" fill="#0F172A" />
  <text x="470" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC" text-anchor="middle">
    SO SÁNH 3 KIẾN TRÚC TÔ-PÔ BIẾN TẦN QUANG ĐIỆN (INVERTER TOPOLOGIES)
  </text>

  <!-- Column 1: Central Inverter -->
  <g transform="translate(40, 90)" filter="url(#cardShadow)">
    <rect width="270" height="410" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="0" y="0" width="270" height="40" rx="10" fill="#475569" />
    <text x="135" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      1. CENTRAL INVERTER
    </text>

    <!-- Visual Schematic -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="50" height="30" rx="4" fill="#0284C7" />
      <rect x="0" y="40" width="50" height="30" rx="4" fill="#0284C7" />
      <rect x="0" y="80" width="50" height="30" rx="4" fill="#0284C7" />
      <text x="25" y="18" font-family="system-ui, sans-serif" font-size="9" fill="#FFF" text-anchor="middle">Str 1</text>
      <text x="25" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#FFF" text-anchor="middle">Str 2</text>
      <text x="25" y="98" font-family="system-ui, sans-serif" font-size="9" fill="#FFF" text-anchor="middle">Str N</text>

      <path d="M 50 15 L 100 55 M 50 55 L 100 55 M 50 95 L 100 55" stroke="#64748B" stroke-width="2" />

      <!-- Combiner Box -->
      <rect x="100" y="35" width="40" height="40" rx="4" fill="#E2E8F0" stroke="#475569" />
      <text x="120" y="58" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#1E293B" text-anchor="middle">DC Box</text>

      <line x1="140" y1="55" x2="170" y2="55" stroke="#64748B" stroke-width="2" marker-end="url(#arr)" />

      <!-- Central Inv -->
      <rect x="170" y="25" width="55" height="60" rx="6" fill="#1E293B" />
      <text x="197" y="52" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">CENTRAL</text>
      <text x="197" y="65" font-family="system-ui, sans-serif" font-size="8" fill="#38BDF8" text-anchor="middle">&gt;500kW</text>
    </g>

    <!-- Characteristics -->
    <g transform="translate(15, 200)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1">Quy mô:</text>
      <text x="50" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Utility-Scale (&gt; 1 MWp)</text>

      <text x="0" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#059669">Ưu điểm:</text>
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Chi phí CAPEX/Wp rẻ nhất</text>
      <text x="0" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Dễ quản lý điểm đấu nối tập trung</text>

      <text x="0" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#DC2626">Nhược điểm:</text>
      <text x="0" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Điểm nghẽn rủi ro cao (Single Failure)</text>
      <text x="0" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Mất mát MPPT lớn khi bị bóng che</text>
      <text x="0" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Cáp DC kéo dài tổn thất cao</text>
    </g>
  </g>

  <!-- Column 2: String Inverter (UNISOLAR Focus) -->
  <g transform="translate(335, 90)" filter="url(#cardShadow)">
    <rect width="270" height="410" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" />
    <rect x="0" y="0" width="270" height="40" rx="10" fill="#16A34A" />
    <text x="135" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      2. STRING INVERTER (UNISOLAR)
    </text>

    <!-- Visual Schematic -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="50" height="25" rx="3" fill="#0284C7" />
      <rect x="0" y="32" width="50" height="25" rx="3" fill="#0284C7" />
      <text x="25" y="16" font-family="system-ui, sans-serif" font-size="9" fill="#FFF" text-anchor="middle">Str 1</text>
      <text x="25" y="48" font-family="system-ui, sans-serif" font-size="9" fill="#FFF" text-anchor="middle">Str 2</text>

      <path d="M 50 12 L 95 28 M 50 44 L 95 28" stroke="#16A34A" stroke-width="2" />

      <!-- String Inv 1 -->
      <rect x="95" y="10" width="60" height="40" rx="5" fill="#065F46" />
      <text x="125" y="28" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFF" text-anchor="middle">Fronius/SMA</text>
      <text x="125" y="40" font-family="system-ui, sans-serif" font-size="8" fill="#A7F3D0" text-anchor="middle">25-50kW</text>

      <!-- Str 3 & Inv 2 -->
      <rect x="0" y="75" width="50" height="25" rx="3" fill="#0284C7" />
      <text x="25" y="91" font-family="system-ui, sans-serif" font-size="9" fill="#FFF" text-anchor="middle">Str 3</text>
      <line x1="50" y1="87" x2="95" y2="87" stroke="#16A34A" stroke-width="2" />
      <rect x="95" y="68" width="60" height="40" rx="5" fill="#065F46" />
      <text x="125" y="90" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFF" text-anchor="middle">ABB Trio</text>

      <path d="M 155 30 L 200 55 M 155 88 L 200 55" stroke="#16A34A" stroke-width="2" marker-end="url(#arr)" />
      <text x="210" y="60" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#065F46">Lưới AC</text>
    </g>

    <!-- Characteristics -->
    <g transform="translate(15, 200)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1">Quy mô:</text>
      <text x="50" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803D">Áp mái C&amp;I (20kW - 500kW)</text>

      <text x="0" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#059669">Ưu điểm (Lý do chọn cho La Trobe):</text>
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#14532D">• Đa kênh MPPT bám từng hướng mái</text>
      <text x="0" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#14532D">• Hỏng 1 Inverter chỉ mất 1 cụm nhỏ</text>
      <text x="0" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#14532D">• Dễ dàng thay thế &amp; bảo trì O&amp;M</text>

      <text x="0" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B45309">Lưu ý cho DA:</text>
      <text x="0" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#713F12">• Cần chuẩn hóa dữ liệu theo số lượng</text>
      <text x="0" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#713F12">  Inverter từng trạm: [kWh/inverter]</text>
    </g>
  </g>

  <!-- Column 3: Micro-Inverter / Optimizer -->
  <g transform="translate(630, 90)" filter="url(#cardShadow)">
    <rect width="270" height="410" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="0" y="0" width="270" height="40" rx="10" fill="#475569" />
    <text x="135" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      3. MICRO-INV &amp; OPTIMIZER
    </text>

    <!-- Visual Schematic -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="45" height="25" rx="3" fill="#0284C7" />
      <rect x="60" y="0" width="40" height="25" rx="4" fill="#D97706" />
      <text x="80" y="16" font-family="system-ui, sans-serif" font-size="8" fill="#FFF" text-anchor="middle">Opt</text>

      <rect x="0" y="35" width="45" height="25" rx="3" fill="#0284C7" />
      <rect x="60" y="35" width="40" height="25" rx="4" fill="#D97706" />
      <text x="80" y="51" font-family="system-ui, sans-serif" font-size="8" fill="#FFF" text-anchor="middle">Opt</text>

      <rect x="0" y="70" width="45" height="25" rx="3" fill="#0284C7" />
      <rect x="60" y="70" width="40" height="25" rx="4" fill="#D97706" />
      <text x="80" y="86" font-family="system-ui, sans-serif" font-size="8" fill="#FFF" text-anchor="middle">Opt</text>

      <path d="M 100 12 L 150 47 M 100 47 L 150 47 M 100 82 L 150 47" stroke="#D97706" stroke-width="2" />
      <rect x="150" y="30" width="55" height="35" rx="4" fill="#1E293B" />
      <text x="177" y="52" font-family="system-ui, sans-serif" font-size="8" fill="#FFF" text-anchor="middle">Inverter</text>
    </g>

    <!-- Characteristics -->
    <g transform="translate(15, 200)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1">Quy mô:</text>
      <text x="50" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Dân dụng / Mái bóng râm phức tạp</text>

      <text x="0" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#059669">Ưu điểm:</text>
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• MPPT cấp độ từng tấm pin (Module-level)</text>
      <text x="0" y="58" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Triệt tiêu 100% Mismatched Loss</text>
      <text x="0" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Giám sát dữ liệu đến từng panel</text>

      <text x="0" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#DC2626">Nhược điểm:</text>
      <text x="0" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Chi phí CAPEX rất cao</text>
      <text x="0" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Số lượng linh kiện điện tử trên mái lớn</text>
    </g>
  </g>
</svg>
