<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F8FAFC; }
      .subhdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .txt-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0F172A; }
      .formula { font-family: "Courier New", Courier, monospace; font-size: 10.5px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1060" height="580" fill="#F8FAFC" rx="10" />

  <!-- Header Banner -->
  <rect x="20" y="15" width="1020" height="46" rx="8" fill="#0F172A" />
  <text x="530" y="35" text-anchor="middle" class="hdr">TỐI ƯU HÓA CƠ SỞ DỮ LIỆU: PHÂN VÙNG BẢNG FACT &amp; ĐỊNH TUYẾN CONNECTION POOLER</text>
  <text x="530" y="51" text-anchor="middle" class="subhdr">Cơ chế Partition Pruning giảm 66% quét đĩa, Composite B-Tree Indexes và định tuyến PgBouncer Port 5432 / 6543</text>

  <!-- Left Column: Table Partitioning & Composite Indexes -->
  <g transform="translate(20, 75)">
    <rect width="500" height="485" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <rect width="500" height="34" rx="8" fill="#F0F9FF" />
    <text x="250" y="22" text-anchor="middle" class="box-title" fill="#0369A1">1. PHÂN VÙNG VẬT LÝ BẢNG FACT &amp; PARTITION PRUNING</text>

    <!-- Master Partition Table Box -->
    <g transform="translate(15, 46)">
      <rect width="470" height="85" rx="6" fill="#F8FAFC" stroke="#BAE6FD" />
      <text x="12" y="20" class="txt-bold" fill="#0369A1">BẢNG FACT CHÍNH (MASTER TABLE): fact_solar_energy_gen</text>
      <text x="12" y="38" class="formula" fill="#0F172A">PARTITION BY RANGE (date_id)  ➔  Tổng: 2,731,946 bản ghi</text>
      <text x="12" y="56" class="txt">• Chỉ mục phức hợp: (site_id, date_id) và (date_id, time_id)</text>
      <text x="12" y="74" class="txt-bold" fill="#15803D">• Tốc độ truy vấn: Giảm từ 8.4 giây xuống &lt; 120 ms (Index Scan)</text>
    </g>

    <!-- 3 Partitions Visual -->
    <g transform="translate(15, 140)">
      <!-- Partition 2020 -->
      <rect x="0" y="0" width="150" height="135" rx="6" fill="#F0FDF4" stroke="#86EFAC" />
      <text x="75" y="22" text-anchor="middle" class="txt-bold" fill="#15803D">fact_solar_2020</text>
      <text x="75" y="42" text-anchor="middle" class="txt" font-size="10">Năm 2020</text>
      <text x="75" y="60" text-anchor="middle" class="formula" font-size="10" fill="#0F172A">1,054,080 dòng</text>
      <text x="75" y="80" text-anchor="middle" class="txt" font-size="9">date_id: 20200101</text>
      <text x="75" y="95" text-anchor="middle" class="txt" font-size="9">➔ 20201231</text>
      <rect x="15" y="105" width="120" height="20" rx="3" fill="#BBF7D0" />
      <text x="75" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#15803D">ACTIVE</text>

      <!-- Partition 2021 (Target Query) -->
      <rect x="160" y="0" width="150" height="135" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
      <text x="235" y="22" text-anchor="middle" class="txt-bold" fill="#1D4ED8">fact_solar_2021</text>
      <text x="235" y="42" text-anchor="middle" class="txt" font-size="10">Năm 2021 (Target)</text>
      <text x="235" y="60" text-anchor="middle" class="formula" font-size="10" fill="#0F172A">1,051,200 dòng</text>
      <text x="235" y="80" text-anchor="middle" class="txt" font-size="9">date_id: 20210101</text>
      <text x="235" y="95" text-anchor="middle" class="txt" font-size="9">➔ 20211231</text>
      <rect x="175" y="105" width="120" height="20" rx="3" fill="#3B82F6" />
      <text x="235" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">SCANNED (1/3)</text>

      <!-- Partition 2022 -->
      <rect x="320" y="0" width="150" height="135" rx="6" fill="#F0FDF4" stroke="#86EFAC" />
      <text x="395" y="22" text-anchor="middle" class="txt-bold" fill="#15803D">fact_solar_2022</text>
      <text x="395" y="42" text-anchor="middle" class="txt" font-size="10">Năm 2022 (4 tháng)</text>
      <text x="395" y="60" text-anchor="middle" class="formula" font-size="10" fill="#0F172A">626,666 dòng</text>
      <text x="395" y="80" text-anchor="middle" class="txt" font-size="9">date_id: 20220101</text>
      <text x="395" y="95" text-anchor="middle" class="txt" font-size="9">➔ 20220430</text>
      <rect x="335" y="105" width="120" height="20" rx="3" fill="#BBF7D0" />
      <text x="395" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#15803D">ACTIVE</text>
    </g>

    <!-- Partition Pruning Explanation -->
    <g transform="translate(15, 290)">
      <rect width="470" height="175" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="12" y="20" class="txt-bold" fill="#0F172A">HIỆU QUẢ CƠ CHẾ PARTITION PRUNING:</text>
      <text x="12" y="38" class="txt">• Khi Tableau Desktop lọc: WHERE date_id BETWEEN 20210101 AND 20211231</text>
      <text x="12" y="58" class="formula" fill="#1D4ED8">➔ PostgreSQL Planner tự động LOẠI BỎ hoàn toàn 2 phân vùng 2020 &amp; 2022</text>
      <text x="12" y="78" class="txt-bold" fill="#15803D">• Giảm chính xác 66% khối lượng quét I/O đĩa cứng!</text>
      <text x="12" y="98" class="txt">• Phân tán khóa ngoại: Mỗi phân vùng con tự quản trị Index riêng biệt,</text>
      <text x="12" y="116" class="txt">giúp việc bảo trì, vacuum và nạp dữ liệu không gây khóa bảng master.</text>
      <text x="12" y="142" class="formula" fill="#0369A1">Query Execution: Bitmap Index Scan ➔ Heap Fetch (118 ms)</text>
    </g>
  </g>

  <!-- Right Column: Supabase Connection Pooling (PgBouncer) -->
  <g transform="translate(540, 75)">
    <rect width="500" height="485" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2" />
    <rect width="500" height="34" rx="8" fill="#FFFBEB" />
    <text x="250" y="22" text-anchor="middle" class="box-title" fill="#B45309">2. ĐỊNH TUYẾN SUPABASE CONNECTION POOLING (PGBOUNCER)</text>

    <!-- Client Clients Row -->
    <g transform="translate(15, 46)">
      <!-- Python ETL Client -->
      <rect x="0" y="0" width="225" height="75" rx="6" fill="#F0F9FF" stroke="#0284C7" />
      <text x="112" y="20" text-anchor="middle" class="txt-bold" fill="#0369A1">PYTHON ETL PIPELINE</text>
      <text x="112" y="38" text-anchor="middle" class="txt" font-size="10">Driver: pg8000 (Pure Python)</text>
      <text x="112" y="54" text-anchor="middle" class="formula" font-size="9" fill="#0284C7">Bulk Load / Prepared Stmts</text>

      <!-- Tableau BI Client -->
      <rect x="245" y="0" width="225" height="75" rx="6" fill="#FFFBEB" stroke="#D97706" />
      <text x="357" y="20" text-anchor="middle" class="txt-bold" fill="#B45309">TABLEAU DESKTOP (BI)</text>
      <text x="357" y="38" text-anchor="middle" class="txt" font-size="10">Multi-User Interactive Dashboards</text>
      <text x="357" y="54" text-anchor="middle" class="formula" font-size="9" fill="#B45309">Hàng trăm truy vấn ngắn/giây</text>
    </g>

    <!-- PgBouncer Pooler Middleware -->
    <g transform="translate(15, 140)">
      <!-- Port 5432 Routing -->
      <path d="M 112 -15 L 112 15" fill="none" stroke="#0284C7" stroke-width="2" />
      <rect x="0" y="15" width="225" height="110" rx="6" fill="#F8FAFC" stroke="#0284C7" />
      <text x="112" y="35" text-anchor="middle" class="txt-bold" fill="#0369A1">PORT 5432: SESSION MODE</text>
      <text x="10" y="55" class="txt">• Giữ kết nối liên tục theo Session</text>
      <text x="10" y="71" class="txt">• Hỗ trợ câu lệnh nạp khối lớn</text>
      <text x="10" y="87" class="txt">• Phục vụ luồng ETL định kỳ</text>
      <text x="10" y="107" class="formula" font-size="9" fill="#0369A1">Dedicated ETL Connection</text>

      <!-- Port 6543 Routing -->
      <path d="M 357 -15 L 357 15" fill="none" stroke="#D97706" stroke-width="2" />
      <rect x="245" y="15" width="225" height="110" rx="6" fill="#F8FAFC" stroke="#D97706" />
      <text x="357" y="35" text-anchor="middle" class="txt-bold" fill="#B45309">PORT 6543: TRANSACTION MODE</text>
      <text x="255" y="55" class="txt">• Tái sử dụng Pool ngay sau Transaction</text>
      <text x="255" y="71" class="txt">• Phục vụ hàng trăm Dashboard Users</text>
      <text x="255" y="87" class="txt">• Ngăn ngừa triệt tiêu max_connections</text>
      <text x="255" y="107" class="formula" font-size="9" fill="#B45309">Zero Database Overload</text>
    </g>

    <!-- PostgreSQL Database Target -->
    <g transform="translate(15, 290)">
      <path d="M 112 -15 L 112 15" fill="none" stroke="#475569" stroke-width="2" />
      <path d="M 357 -15 L 357 15" fill="none" stroke="#475569" stroke-width="2" />
      
      <rect x="0" y="15" width="470" height="145" rx="6" fill="#0F172A" />
      <text x="235" y="38" text-anchor="middle" class="hdr" font-size="12">POSTGRESQL 16 ENTERPRISE DWH (SUPABASE)</text>
      
      <text x="20" y="62" class="subhdr" fill="#F8FAFC">• Xác thực an toàn: Chuẩn SCRAM-SHA-256 mã hóa mật khẩu</text>
      <text x="20" y="82" class="subhdr" fill="#F8FAFC">• Phân quyền chặt chẽ: Tài khoản Tableau chỉ có quyền SELECT trên Materialized Views</text>
      <text x="20" y="102" class="subhdr" fill="#F8FAFC">• Giao dịch Nguyên tử: Tự động ROLLBACK khi chạy với cờ --dry-run</text>
      <text x="235" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#38BDF8">ĐẢM BẢO 100% HIỆU NĂNG VÀ AN TOÀN HỆ THỐNG DWH</text>
    </g>
  </g>
</svg>
