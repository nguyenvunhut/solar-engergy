step:
  name: 03_load_object_storage_to_staging

object_storage:
  endpoint_env: SUPABASE_S3_ENDPOINT
  access_key_env: SUPABASE_S3_ACCESS_KEY
  secret_key_env: SUPABASE_S3_SECRET_KEY
  region: ap-southeast-1
  bucket_env: SUPABASE_BUCKET

database:
  schema: staging

files:
  - file_name: Solar_Energy_Generation.csv
    table: stg_solar_energy_generation
    columns:
      - CampusKey
      - SiteKey
      - Timestamp
      - SolarGeneration
    rename:
      CampusKey: campuskey
      SiteKey: sitekey
      Timestamp: timestamp
      SolarGeneration: solargeneration
    batch_size: 10000

  - file_name: Solar_Site_Details.csv
    table: stg_solar_site_details
    columns:
      - CampusKey
      - SiteKey
      - kWp
      - Number of panels
      - Panel
      - Inverter
      - Optimizers
      - Metric
      - lat
      - Lon
    rename:
      CampusKey: campuskey
      SiteKey: sitekey
      kWp: kwp
      Number of panels: number_of_panels
      Panel: panel
      Inverter: inverter
      Optimizers: optimizers
      Metric: metric
      lat: lat
      Lon: lon
    batch_size: 1000

  - file_name: open_meteo_weather_raw_2020_2022.csv
    table: stg_open_meteo_weather_raw
    columns:
      - timestamp
      - shortwave_radiation
      - direct_radiation
      - diffuse_radiation
      - temperature_2m
      - weather_code
      - is_day
      - cloud_cover
      - cloud_cover_low
      - cloud_cover_mid
      - cloud_cover_high
      - wind_speed_10m
      - precipitation
      - sunshine_duration
      - SiteKey
      - latitude
      - longitude
    rename:
      SiteKey: sitekey
    batch_size: 5000

  - file_name: campus_meta.csv
    table: stg_campus_meta
    columns:
      - id
      - name
      - capacity
    rename:
      id: id
      name: name
      capacity: capicity
    batch_size: 1000

  - file_name: calender.csv
    table: stg_calender
    transforms:
      date_format:
        column: date
        input_format: "%Y-%m-%d"
        output_format: "%d/%m/%Y"
    columns:
      - date
      - is_holiday
      - is_semester
      - is_exam
    rename:
      date: date
      is_holiday: is_holiday
      is_semester: is_semester
      is_exam: is_exam
    batch_size: 1000
