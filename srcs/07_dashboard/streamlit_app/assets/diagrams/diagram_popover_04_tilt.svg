<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" height="100%" style="background:#FFFFFF;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="gSludge" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#78350F"/><stop offset="100%" stop-color="#92400E"/></linearGradient>
    <filter id="shadowW4" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.07"/></filter>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="14" width="940" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="40" y="41" fill="#0F172A" font-size="14.5" font-weight="700">CƠ CHẾ TÁC ĐỘNG 4: HÌNH HỌC QUANG HỌC GÓC NGHIÊNG 15° VÀ CƠ CHẾ NƯỚC MƯA TỰ RỬA TRÔI BÙN ĐỌNG</text>

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: FLAT ROOF 0 DEGREE (RED BORDER)                              -->
  <!-- ========================================================================= -->
  <g transform="translate(20, 70)" filter="url(#shadowW4)">
    <rect width="455" height="450" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="15" y="10" width="425" height="26" rx="4" fill="#FEF2F2"/>
    <text x="25" y="28" fill="#B91C1C" font-size="12" font-weight="700">MÁI BẰNG NẰM PHẲNG (GÓC NGHIÊNG = 0°)</text>

    <!-- Zone 1: Two Seasons Solar Geometry -->
    <rect x="15" y="42" width="425" height="175" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="25" y="60" fill="#B91C1C" font-size="11" font-weight="700">1. HÌNH HỌC QUANG HỌC 2 MÙA (HƯỚNG BẮC BÊN PHẢI)</text>

    <!-- Summer Ray (Text at y=78,92 - Ray starts below at y=106) -->
    <text x="90" y="78" fill="#D97706" font-size="10" font-weight="700" text-anchor="middle">Mùa hè (Đỉnh trời 76°)</text>
    <text x="90" y="92" fill="#B45309" font-size="9.5" text-anchor="middle">Chiếu dốc đứng</text>
    <line x1="103" y1="106" x2="90" y2="158" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="89,162 86,153 94,155" fill="#D97706"/>
    <!-- 76 deg arc -->
    <path d="M 125 160 A 35 35 0 0 0 98 126" fill="none" stroke="#D97706" stroke-width="1.5"/>
    <text x="122" y="145" fill="#D97706" font-size="9.5" font-weight="700">76°</text>

    <!-- Winter Ray (Text at y=78,92 - Ray starts below at y=106) -->
    <text x="330" y="78" fill="#DC2626" font-size="10" font-weight="700" text-anchor="middle">Mùa đông (Góc thấp 29°)</text>
    <text x="330" y="92" fill="#991B1B" font-size="9.5" text-anchor="middle">Chiếu xiên góc rất lớn</text>
    <line x1="308" y1="106" x2="210" y2="158" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="206,160 215,155 212,163" fill="#DC2626"/>
    <!-- 29 deg arc -->
    <path d="M 270 160 A 60 60 0 0 0 255 135" fill="none" stroke="#DC2626" stroke-width="1.5"/>
    <text x="272" y="152" fill="#DC2626" font-size="10" font-weight="800">29°</text>

    <!-- Compass Indicator -->
    <text x="40" y="172" fill="#64748B" font-size="9" font-weight="700">Nam (S)</text>
    <text x="415" y="172" fill="#64748B" font-size="9" font-weight="700" text-anchor="end">Bắc (N)</text>

    <!-- PV Module Horizontal -->
    <rect x="70" y="160" width="315" height="16" rx="2" fill="#1E3A8A" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="227" y="172" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">TẤM PIN NẰM PHẲNG 0° TRÊN MÁI</text>

    <!-- Roof Line -->
    <rect x="35" y="176" width="385" height="8" fill="#E2E8F0" stroke="#94A3B8"/>

    <!-- Summary note of Zone 1 -->
    <text x="227" y="202" fill="#B91C1C" font-size="10" font-weight="700" text-anchor="middle">Mùa hè phát điện tốt · Mùa đông sụt giảm sâu do góc chiếu xiên 29°</text>

    <!-- Zone 2: Sludge Band & Bypass Diode Activation -->
    <rect x="15" y="225" width="425" height="210" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="25" y="244" fill="#B91C1C" font-size="11" font-weight="700">2. NƯỚC TÙ ĐỌNG &amp; DẢI BÙN CẶN CHE HÀNG CELL ĐÁY</text>

    <!-- PV Module Cross Section Diagram -->
    <rect x="35" y="256" width="385" height="42" rx="3" fill="#1E3A8A" stroke="#1D4ED8" stroke-width="1.5"/>
    
    <!-- Cell 1 Normal (Left) -->
    <rect x="48" y="261" width="115" height="32" rx="2" fill="#2563EB"/>
    <text x="105" y="276" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Cell Đỉnh</text>
    <text x="105" y="289" fill="#93C5FD" font-size="8.5" text-anchor="middle">Hoạt động bình thường</text>

    <!-- Cell 2 Normal (Middle) -->
    <rect x="175" y="261" width="115" height="32" rx="2" fill="#2563EB"/>
    <text x="232" y="276" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Cell Giữa</text>
    <text x="232" y="289" fill="#93C5FD" font-size="8.5" text-anchor="middle">Hoạt động bình thường</text>

    <!-- Cell 3 Shaded by Sludge (Right / North Edge) -->
    <rect x="300" y="261" width="115" height="32" rx="2" fill="url(#gSludge)" stroke="#451A03" stroke-width="1.5"/>
    <text x="357" y="276" fill="#FFFFFF" font-size="10" font-weight="900" text-anchor="middle">BÙN ĐỌNG CHE KÍN</text>
    <text x="357" y="289" fill="#FEF3C7" font-size="8.5" font-weight="700" text-anchor="middle">(Cell đáy ngừng phát)</text>

    <!-- Aluminum bottom frame rim on the right (North edge) -->
    <rect x="415" y="250" width="13" height="54" fill="#64748B" stroke="#475569"/>

    <!-- Sludge callout label -->
    <text x="227" y="314" fill="#78350F" font-size="10" font-weight="800" text-anchor="middle">Gờ nhôm cản nước → Nước tù bốc hơi đọng dải bùn cặn dày</text>

    <!-- Explanation Box -->
    <rect x="25" y="326" width="405" height="98" rx="4" fill="#FEF2F2" stroke="#EF4444"/>
    <text x="35" y="347" fill="#991B1B" font-size="10.5" font-weight="700">• Nước mưa không có độ dốc để tự thoát khỏi gờ nhôm đáy.</text>
    <text x="35" y="369" fill="#DC2626" font-size="10.5" font-weight="800">• Dải bùn kích hoạt Bypass Diode ngắn mạch → MẤT 1/3 CÔNG SUẤT.</text>
    <text x="35" y="391" fill="#7F1D1D" font-size="10.5" font-weight="700">• Tấm pin bị nóng cục bộ (Hotspot) làm suy thoái tuổi thọ nặng nề.</text>
    <text x="35" y="413" fill="#B91C1C" font-size="10" font-weight="600">→ Hụt mất 18.500 kWh/năm do bùn cặn viền nhôm đáy.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT COLUMN: TILTED NORTH 15 DEGREE (TILT RIGHT TO NORTH)                -->
  <!-- ========================================================================= -->
  <g transform="translate(505, 70)" filter="url(#shadowW4)">
    <rect width="455" height="450" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <rect x="15" y="10" width="425" height="26" rx="4" fill="#F0FDF4"/>
    <text x="25" y="28" fill="#166534" font-size="12" font-weight="700">NÂNG KHUNG NGHIÊNG 15° HƯỚNG BẮC (NGHIÊNG SANG PHẢI)</text>

    <!-- Zone 1: Two Seasons Solar Geometry -->
    <rect x="15" y="42" width="425" height="175" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="25" y="60" fill="#166534" font-size="11" font-weight="700">1. HÌNH HỌC QUANG HỌC 2 MÙA (ĐÓN NẮNG PHƯƠNG BẮC)</text>

    <!-- Summer Ray (Text at y=78,92 - Ray starts below at y=106) -->
    <text x="90" y="78" fill="#D97706" font-size="10" font-weight="700" text-anchor="middle">Mùa hè (76° đỉnh trời)</text>
    <text x="90" y="92" fill="#B45309" font-size="9.5" text-anchor="middle">Lệch nhẹ ~15° (-1,5%)</text>
    <line x1="102" y1="106" x2="90" y2="153" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="89,157 86,148 94,150" fill="#D97706"/>

    <!-- Winter Ray (Text at y=78,92 - Ray starts below at y=106) -->
    <text x="330" y="78" fill="#059669" font-size="10" font-weight="800" text-anchor="middle">Mùa đông (Góc thấp 29°)</text>
    <text x="330" y="92" fill="#166534" font-size="9.5" font-weight="700" text-anchor="middle">GÓC ĐÓN VUÔNG GÓC (+20,8%)</text>
    <line x1="295" y1="106" x2="180" y2="158" stroke="#059669" stroke-width="3" stroke-dasharray="5,3"/>
    <polygon points="176,160 185,155 182,163" fill="#059669"/>
    <!-- 29 deg angle arc -->
    <path d="M 270 178 A 70 70 0 0 0 250 142" fill="none" stroke="#059669" stroke-width="1.5"/>
    <text x="270" y="165" fill="#059669" font-size="10" font-weight="800">29°</text>

    <!-- Compass Indicator -->
    <text x="40" y="172" fill="#64748B" font-size="9" font-weight="700">Nam (S)</text>
    <text x="415" y="172" fill="#64748B" font-size="9" font-weight="700" text-anchor="end">Bắc (N)</text>

    <!-- Tilted PV Module: Elevated at Left/South (75, 130), Sloping Down to Right/North (265, 178) -->
    <polygon points="75,130 265,178 262,192 72,144" fill="#1E3A8A" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="170" y="162" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle" transform="rotate(14.1 170 162)">PIN NGHIÊNG 15° HƯỚNG BẮC</text>

    <!-- Triangular Aluminum Support Structure -->
    <polygon points="72,144 72,186 262,186" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <text x="105" y="180" fill="#0369A1" font-size="8.5" font-weight="700">Khung 15°</text>

    <!-- Roof Line at y=186 -->
    <rect x="35" y="186" width="385" height="8" fill="#E2E8F0" stroke="#94A3B8"/>

    <!-- Summary note of Zone 1 -->
    <text x="227" y="206" fill="#059669" font-size="10" font-weight="700" text-anchor="middle">Tăng vọt sản lượng mùa đông (+44.436 kWh), bù đắp đúng đỉnh phụ tải</text>

    <!-- Zone 2: Rain Self-Cleaning & Full Power Preservation (Height 210px) -->
    <rect x="15" y="225" width="425" height="210" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="25" y="244" fill="#166534" font-size="11" font-weight="700">2. NƯỚC MƯA TỰ RỬA TRÔI &amp; BẢO TOÀN 100% CÔNG SUẤT</text>

    <!-- Rain Self-cleaning Tag Centered at top of Zone 2 -->
    <rect x="135" y="252" width="185" height="20" rx="4" fill="#E0F2FE" stroke="#0284C7"/>
    <text x="227" y="266" fill="#0369A1" font-size="9.5" font-weight="800" text-anchor="middle">Dòng nước mưa tự rửa trôi</text>

    <!-- Rain Runoff Arrow: Parallel, strictly 13px ABOVE the glass surface -->
    <line x1="70" y1="263" x2="360" y2="311" stroke="#0284C7" stroke-width="3" stroke-dasharray="6,3"/>
    <polygon points="365,312 355,310 358,302" fill="#0284C7"/>

    <!-- Tilted Module Frame Body -->
    <polygon points="75,276 365,324 362,342 72,294" fill="#1E3A8A" stroke="#1D4ED8" stroke-width="1.5"/>

    <!-- 3 Clean Cells -->
    <!-- Cell 3 (Top Left: x=85 to x=170) -->
    <polygon points="83,281 168,295 166,310 81,296" fill="#2563EB"/>
    <text x="125" y="302" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(9.4 125 302)">Cell 3 Sạch</text>

    <!-- Cell 2 (Middle: x=180 to x=265) -->
    <polygon points="178,297 263,311 261,326 176,312" fill="#2563EB"/>
    <text x="220" y="318" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(9.4 220 318)">Cell 2 Sạch</text>

    <!-- Cell 1 (Bottom Right: x=275 to x=360) -->
    <polygon points="273,313 358,327 356,342 271,328" fill="#2563EB"/>
    <text x="315" y="334" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(9.4 315 334)">Cell 1 Sạch</text>

    <!-- Explanation Box -->
    <rect x="25" y="348" width="405" height="78" rx="4" fill="#F0FDF4" stroke="#059669"/>
    <text x="35" y="366" fill="#166534" font-size="10.5" font-weight="700">• Độ dốc 15° tạo động năng cho nước mưa tự chảy tràn sang phải.</text>
    <text x="35" y="386" fill="#059669" font-size="10.5" font-weight="800">• Bụi bẩn và bùn cặn bị cuốn trôi hoàn toàn qua gờ nhôm đáy.</text>
    <text x="35" y="406" fill="#047857" font-size="10.5" font-weight="700">• Triệt tiêu che bóng → Bảo toàn 100% công suất (+18.500 kWh/năm).</text>
  </g>
</svg>