<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hạng Mục 1: Hệ Thống Pin Lưu Trữ BESS 1MW / 2.5MWh & Thu Hồi Inverter Clipping — Sơ Đồ Kỹ Thuật High-DPI</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            transition: all 0.2s ease;
        }
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .title-group h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
        }
        .title-group p {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            transition: all 0.15s ease;
            text-decoration: none;
        }
        .btn:hover {
            background: var(--border-color);
        }
        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .viewer-card {
            width: 100%;
            max-width: 1200px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }
        .svg-container {
            width: 100%;
            max-width: 1100px;
            height: auto;
        }
        .svg-container svg {
            width: 100%;
            height: auto;
            display: block;
        }
        @media print {
            .header, .toolbar { display: none !important; }
            body { padding: 0; background: #fff; }
            .viewer-card { border: none; box-shadow: none; padding: 0; max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title-group">
            <h1>Hạng Mục 1: Hệ Thống Pin Lưu Trữ BESS 1MW / 2.5MWh & Thu Hồi Inverter Clipping</h1>
            <p>Vector SVG High-DPI — Chuẩn Trình Chiếu Slide & Báo Cáo Tốt Nghiệp</p>
        </div>
        <div class="toolbar">
            <button class="btn" onclick="toggleTheme()">🌓 Sáng / Tối</button>
            <button class="btn" onclick="window.print()">📄 In / PDF</button>
            <button class="btn btn-primary" onclick="exportHighResPNG()">📸 Tải PNG 4K (300 DPI)</button>
            <a href="index.html" class="btn">📂 Danh Mục Sơ Đồ</a>
        </div>
    </div>

    <div class="viewer-card">

        </div>
    </div>

    <script>
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        function exportHighResPNG() {
            const svgElement = document.querySelector('#svgContainer svg');
            if (!svgElement) return;

            const svgString = new XMLSerializer().serializeToString(svgElement);
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const URL = window.URL || window.webkitURL || window;
            const blobURL = URL.createObjectURL(svgBlob);

            const image = new Image();
            image.onload = function() {
                const scale = 4;
                const canvas = document.createElement('canvas');
                canvas.width = (svgElement.viewBox.baseVal.width || 980) * scale;
                canvas.height = (svgElement.viewBox.baseVal.height || 540) * scale;
                
                const context = canvas.getContext('2d');
                context.fillStyle = '#FFFFFF';
                context.fillRect(0, 0, canvas.width, canvas.height);
                context.drawImage(image, 0, 0, canvas.width, canvas.height);

                const pngURL = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = pngURL;
                downloadLink.download = 'diagram_popover_01_bess.png';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            };
            image.src = blobURL;
        }
    </script>
</body>
</html>
