<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="100%" height="100%" style="background:#FFFFFF;font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="gHeatFlush" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#DC2626"/><stop offset="100%" stop-color="#991B1B"/></linearGradient>
    <linearGradient id="gCoolAir" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.3"/><stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6"/></linearGradient>
    <filter id="shadowW2" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.07"/></filter>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="14" width="940" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="40" y="41" fill="#0F172A" font-size="14.5" font-weight="700">CƠ CHẾ TÁC ĐỘNG 2: ĐỐI LƯU KHÍ ĐỘNG HỌC KHOẢNG HỞ 150mm VÀ PHỤC HỒI ĐẶC TUYẾN I-V</text>

  <!-- Left Column: Flush Mount (Dinh sat truc tiep vao mat mai 100%) -->
  <g transform="translate(20, 70)" filter="url(#shadowW2)">
    <rect width="455" height="450" rx="8" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="15" y="12" width="425" height="28" rx="4" fill="#FEF2F2"/>
    <text x="25" y="31" fill="#B91C1C" font-size="12" font-weight="700">ÁP SÁT MẶT MÁI 100% (KHE HỞ = 0 mm)</text>

    <!-- Sun rays -->
    <text x="227" y="58" fill="#B45309" font-size="11" font-weight="700" text-anchor="middle">Bức xạ mặt trời GHI</text>
    <line x1="120" y1="65" x2="140" y2="92" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4,3"/>
    <line x1="225" y1="65" x2="225" y2="92" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4,3"/>
    <line x1="330" y1="65" x2="310" y2="92" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4,3"/>

    <!-- PV Module DIRECTLY ON ROOF (Flush - No Gap) -->
    <rect x="35" y="95" width="385" height="30" rx="3" fill="url(#gHeatFlush)" stroke="#B91C1C" stroke-width="2"/>
    <text x="227" y="115" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle">TẤM PIN BỊ NUNG NÓNG: T_cell = 70°C</text>

    <!-- Direct Contact Interface Line -->
    <line x1="35" y1="125" x2="420" y2="125" stroke="#7F1D1D" stroke-width="3"/>

    <!-- Roof Surface Directly Attached Underneath -->
    <rect x="35" y="125" width="385" height="35" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="227" y="147" fill="#475569" font-size="11" font-weight="700" text-anchor="middle">BỀ MẶT MÁI TÔN (TIẾP XÚC TRỰC TIẾP - KHÔNG CÓ GIÓ)</text>

    <!-- Visual Warning Pill -->
    <rect x="65" y="175" width="325" height="32" rx="16" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="227" y="196" fill="#000000" font-size="11.5" font-weight="800" text-anchor="middle">KHÔNG CÓ ĐỐI LƯU KHÍ (v_air = 0 m/s)</text>

    <!-- Visual I-V Curve Representation (Shrunk Voltage) -->
    <rect x="25" y="225" width="405" height="205" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="40" y="248" fill="#B91C1C" font-size="11.5" font-weight="700">ĐẶC TUYẾN I-V BỊ CO RÚT DO QUÁ NHIỆT</text>
    
    <!-- I-V Axes -->
    <line x1="60" y1="400" x2="390" y2="400" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="60" y1="400" x2="60" y2="265" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="395" y="404" fill="#64748B" font-size="10">V (V)</text>
    <text x="40" y="260" fill="#64748B" font-size="10">I (A)</text>

    <!-- Shrunk I-V Curve (Tcell = 70C) -->
    <path d="M 60 280 L 220 280 Q 260 285 275 400" fill="none" stroke="#DC2626" stroke-width="2.5"/>
    
    <!-- Max Power Point (P_mpp Hot) -->
    <circle cx="240" cy="305" r="4.5" fill="#DC2626"/>
    <text x="240" y="295" fill="#B91C1C" font-size="10" font-weight="700" text-anchor="middle">P_mpp (Sụt giảm)</text>

    <!-- Voltage limit marker -->
    <line x1="275" y1="400" x2="275" y2="385" stroke="#DC2626" stroke-width="2"/>
    <text x="275" y="416" fill="#DC2626" font-size="10" font-weight="700" text-anchor="middle">V_oc (70°C)</text>

    <text x="140" y="350" fill="#B91C1C" font-size="10.5" font-weight="600">Sụt giảm điện áp do dP/dT = -0,38%/°C</text>
  </g>

  <!-- Right Column: Ventilated Mount (150mm Bracket) -->
  <g transform="translate(505, 70)" filter="url(#shadowW2)">
    <rect width="455" height="450" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <rect x="15" y="12" width="425" height="28" rx="4" fill="#F0FDF4"/>
    <text x="25" y="31" fill="#166534" font-size="12" font-weight="700">NÂNG KHUNG THÔNG GIÓ (KHE HỞ = 150 mm)</text>

    <!-- Sun rays -->
    <text x="227" y="58" fill="#B45309" font-size="11" font-weight="700" text-anchor="middle">Bức xạ mặt trời GHI</text>
    <line x1="120" y1="65" x2="140" y2="92" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4,3"/>
    <line x1="225" y1="65" x2="225" y2="92" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4,3"/>
    <line x1="330" y1="65" x2="310" y2="92" stroke="#D97706" stroke-width="2.5" stroke-dasharray="4,3"/>

    <!-- PV Module ELEVATED -->
    <rect x="35" y="95" width="385" height="26" rx="3" fill="#1E3A8A" stroke="#1D4ED8" stroke-width="1.5"/>
    <text x="227" y="112" fill="#FFFFFF" font-size="11.5" font-weight="800" text-anchor="middle">TẤM PIN ĐƯỢC GIẢI NHIỆT: T_cell = 58°C (-12°C)</text>

    <!-- Air Gap with Chimney Flow -->
    <rect x="35" y="121" width="385" height="48" fill="url(#gCoolAir)" stroke="#BAE6FD" stroke-width="1"/>
    
    <!-- Flow arrow passing along upper-middle part of gap -->
    <path d="M 50 138 Q 140 128 230 128 Q 320 128 400 125" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="6,3"/>
    <polygon points="405,125 397,121 398,129" fill="#0284C7"/>
    
    <!-- SOLID BLACK TEXT lowered to bottom of gap (y=158) to avoid arrow -->
    <text x="227" y="158" fill="#000000" font-size="11" font-weight="900" text-anchor="middle">ĐỐI LƯU KHÔNG KHÍ TỰ NHIÊN (KHE 150 mm)</text>

    <!-- Support Brackets -->
    <rect x="75" y="121" width="10" height="48" fill="#64748B"/>
    <rect x="365" y="121" width="10" height="48" fill="#64748B"/>

    <!-- Roof Surface -->
    <rect x="35" y="169" width="385" height="20" fill="#E2E8F0" stroke="#94A3B8"/>
    <text x="227" y="183" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">BỀ MẶT MÁI TÔN</text>

    <!-- Visual I-V Curve Representation (Restored Voltage) -->
    <rect x="25" y="225" width="405" height="205" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="40" y="248" fill="#166534" font-size="11.5" font-weight="700">ĐẶC TUYẾN I-V ĐƯỢC MỞ RỘNG VÀ PHỤC HỒI</text>

    <!-- I-V Axes -->
    <line x1="60" y1="400" x2="390" y2="400" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="60" y1="400" x2="60" y2="265" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="395" y="404" fill="#64748B" font-size="10">V (V)</text>
    <text x="40" y="260" fill="#64748B" font-size="10">I (A)</text>

    <!-- Hot Curve (Reference Dashed) -->
    <path d="M 60 280 L 220 280 Q 260 285 275 400" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Expanded I-V Curve (Tcell = 58C) -->
    <path d="M 60 280 L 270 280 Q 320 285 345 400" fill="none" stroke="#059669" stroke-width="2.5"/>
    
    <!-- Max Power Point (P_mpp Cool) -->
    <circle cx="295" cy="298" r="4.5" fill="#059669"/>
    <text x="295" y="288" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">P_mpp (Phục hồi)</text>

    <!-- Voltage limit marker -->
    <line x1="345" y1="400" x2="345" y2="385" stroke="#059669" stroke-width="2"/>
    <text x="345" y="416" fill="#059669" font-size="10" font-weight="700" text-anchor="middle">V_oc (58°C)</text>

    <!-- Gain Arrow -->
    <path d="M 278 395 L 340 395" stroke="#0284C7" stroke-width="2"/>
    <polygon points="343,395 336,392 336,398" fill="#0284C7"/>
    <text x="310" y="388" fill="#0284C7" font-size="9.5" font-weight="700" text-anchor="middle">+ΔV_oc</text>

    <text x="155" y="350" fill="#059669" font-size="10.5" font-weight="700">Phục hồi công suất cực đại về gần lý tưởng</text>
  </g>
</svg>