name: Test ETL Refresh Supabase MV

on:
  push:
    branches:
      - test
  workflow_dispatch:
  schedule:
    # Chạy tự động 1 giờ 1 lần
    - cron: '0 * * * *'

jobs:
  test_etl_refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv psycopg2-binary

      - name: Run ETL Refresh Test
        env:
          APP_VERSION: "v1.0.${{ github.run_number }}"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python tests/test_etl_refresh_mv.py
